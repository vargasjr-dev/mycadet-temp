name: PR iOS Checks

on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - "package.json"
      - "bun.lock"
      - "patches/**"
      - "clients/ios/**"
      - "clients/app/capacitor.config.ts"
      - "clients/app/capacitor.config.base.ts"
      - "clients/app/package.json"
      - ".github/workflows/pr-ios.yaml"
  workflow_dispatch:
concurrency:
  group: pr-ios-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    # The runner and Xcode match `release-ios.yaml` so this check exercises
    # the same toolchain that produces TestFlight builds.
    runs-on: macos-15
    # The unsigned Xcode build is what needs the room here; the icon drift
    # check rasterizes 54 icons in seconds. A `macos-15` runner is slow and
    # variable enough that a tighter budget fails on time alone.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Shallow history for the test-filters diff below — same pattern as
          # `pr-assistant.yaml` / `pr-cli.yaml`.
          fetch-depth: 200
          fetch-tags: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        working-directory: clients/app
        # `@mycadet/assistant` is here for the avatar icon drift check below:
        # rasterizing the icons needs its native `@resvg/resvg-js` binding.
        run: |
          bun install --frozen-lockfile \
            --filter=@mycadet/app \
            --filter=@mycadet/assistant

      - name: Test filters
        id: filters
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$GH_EVENT_NAME" != "pull_request" ]; then
            echo "ios_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse -q --verify origin/main >/dev/null; then
            git fetch --depth=200 origin main
          fi
          base="$(git merge-base origin/main HEAD)"
          if git diff --name-only "$base" HEAD -- \
            package.json \
            bun.lock \
            patches \
            clients/ios \
            clients/app/capacitor.config.ts \
            clients/app/capacitor.config.base.ts \
            clients/app/package.json \
            .github/workflows/pr-ios.yaml |
            grep -q .; then
            echo "ios_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios_changed=false" >> "$GITHUB_OUTPUT"
            echo "No iOS-relevant files changed — skipping the Xcode build."
          fi

      - name: Capacitor sync
        if: steps.filters.outputs.ios_changed == 'true'
        working-directory: clients/app
        env:
          # `capacitor.config.ts` derives `server.url` and the Xcode scheme
          # name from this, so it has to agree with the scheme built below.
          CADET_ENVIRONMENT: dev
        run: bunx cap sync ios

      - name: Install XcodeGen
        if: steps.filters.outputs.ios_changed == 'true'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.filters.outputs.ios_changed == 'true'
        working-directory: clients/ios/App
        run: xcodegen generate --spec project.yml

      - name: Select Xcode 26.2
        if: steps.filters.outputs.ios_changed == 'true'
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Unit tests
        if: steps.filters.outputs.ios_changed == 'true'
        working-directory: clients/ios/App
        # The `AppTests` bundle links none of the app targets, so this costs
        # seconds rather than a second full build. The simulator is picked at
        # runtime: the runner image's device names follow whichever iOS
        # runtime ships with Xcode.
        run: |
          simulator=$(xcrun simctl list devices available --json \
            | jq -er '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild test \
            -project App.xcodeproj \
            -scheme AppTests \
            -destination "platform=iOS Simulator,id=$simulator" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build (unsigned)
        if: steps.filters.outputs.ios_changed == 'true'
        working-directory: clients/ios/App
        # Unsigned so the check needs no repository secrets. Signing and
        # TestFlight upload stay in `release-ios.yaml`.
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme "App Dev" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
