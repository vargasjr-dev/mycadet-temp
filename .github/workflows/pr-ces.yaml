name: PR CES-Client Checks

on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      # Only what @mycadet/ces-client actually consumes (its workspace:*
      # dep closure), plus the shared inputs its checks read.
      - "package.json"
      - "bun.lock"
      - "patches/**"
      - "packages/ces-client/**"
      - "packages/service-contracts/**"
      - ".github/workflows/pr-ces.yaml"
  workflow_dispatch:

concurrency:
  group: pr-ces-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: packages/ces-client

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so the test runner can diff the PR's files vs the
          # base and run only what changed (TEST_DIFF_ONLY below).
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/ces-client

      - name: Type check
        run: bun run typecheck

      - name: Test
        env:
          # Diff-scoped like pr-assistant: a PR only re-runs the test files it
          # touched; fail-open to the full suite when the diff can't compute.
          TEST_DIFF_ONLY: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        run: bun run test
