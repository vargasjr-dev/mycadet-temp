name: PR Web Checks

on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - "clients/web/**"
      - ".github/workflows/pr-web.yaml"
  workflow_dispatch:
concurrency:
  group: pr-web-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Independent jobs run in parallel. Each re-runs setup (~15s) but the
# wall-clock win on the long-pole jobs (build, test) outweighs the overhead.
# Reference: https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/using-jobs-in-a-workflow
jobs:
  checks:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    defaults:
      run:
        working-directory: clients/web
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 200
          fetch-tags: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/web --filter=@mycadet/assistant --filter=@mycadet/gateway

      - name: Generate API clients
        run: bun run openapi-ts

      - name: Lint
        run: bun run lint

      - name: Knip (dead code)
        run: bun run knip

      - name: Audit cross-domain import allow-list freshness
        run: |
          if ! bun run audit:cross-domain:check; then
            echo "::group::regenerated allow-list diff"
            bun run audit:cross-domain
            git -c color.ui=never diff -- .cross-domain-allowlist.json | head -200
            echo "::endgroup::"
            exit 1
          fi

      - name: Type check
        run: bun run typecheck

      - name: Build
        env:
          VITE_ENVIRONMENT: ${{ vars.VITE_ENVIRONMENT }}
          VITE_APP_VERSION: ${{ github.sha }}
        run: bun run build

      - name: Test
        env:
          TEST_TIMEOUT_MS: 15000
          TEST_DIFF_ONLY: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        run: bun run test:ci
