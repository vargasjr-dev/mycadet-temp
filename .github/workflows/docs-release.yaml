name: Docs Release

on:
  push:
    branches: [main]
    paths:
      - "clients/docs/**"
      - "packages/design-library/**"
      - "patches/**"
      - ".github/workflows/docs-release.yaml"
  workflow_dispatch:

# Cancel superseded publishes: the channel's latest/ alias must always
# resolve to the newest commit's snapshot.
concurrency:
  group: docs-release
  cancel-in-progress: true

jobs:
  build-and-publish:
    strategy:
      matrix:
        brand: [production, dev]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      # Node runs the build itself (`bun run build` shells out to Node the
      # same way the docs-site image does) — Next's server chunks don't
      # survive a Bun runtime.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.2"

      - name: Install dependencies
        run: |
          if ! bun install --frozen-lockfile --filter=@mycadet/docs; then
            rm -f bun.lock && rm -rf node_modules && bun install --filter=@mycadet/docs
          fi

      - name: Build the docs app
        working-directory: clients/docs
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          CADET_ENVIRONMENT: ${{ matrix.brand }}
        run: bun run build

      - name: Assemble the marketing snapshot
        run: clients/docs/scripts/assemble-snapshot.sh

      - name: Upload the snapshot artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.brand == 'production' && 'docs-frontend' || format('docs-frontend-{0}', matrix.brand) }}
          path: docs-frontend-site
          if-no-files-found: error
