name: PR App Checks

on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - "clients/app/**"
      - "clients/web/**"
      - "assistant/src/api/**"
      - "assistant/openapi.yaml"
      - "packages/design-library/**"
      - "packages/ipc-contract/**"
      - "packages/local-mode/**"
      - "packages/environments/**"
      - "packages/avatar-catalog/**"
      - "packages/avatar-manifest/**"
      - "packages/service-contracts/**"
      - "packages/shared/**"
      - ".github/workflows/pr-app.yaml"
  workflow_dispatch:
concurrency:
  group: pr-app-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type Check, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 200
          fetch-tags: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/app --filter=@mycadet/web

      - name: Generate API clients
        working-directory: clients/web
        run: bun run openapi-ts

      - name: Type check
        working-directory: clients/app
        run: bun run typecheck

      - name: Build
        working-directory: clients/app
        run: bun run build

      - name: Build portable package
        working-directory: clients/app
        run: bun run build:package

      - name: Verify portable package
        working-directory: clients/app
        env:
          NODE_ENV: production
        run: node scripts/verify-package.mjs

      - name: Test
        working-directory: clients/app
        env:
          TEST_TIMEOUT_MS: 15000
          TEST_DIFF_ONLY: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        run: bun run test:ci
