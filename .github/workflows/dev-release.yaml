        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Install design-library dependencies
        working-directory: packages/design-library
        run: bun install --frozen-lockfile --filter=@mycadet/design-library
      - name: Install web dependencies
        working-directory: clients/web
        run: |
          if ! bun install --frozen-lockfile --filter=@mycadet/web; then
            rm -f bun.lock && rm -rf node_modules && bun install --filter=@mycadet/web
          fi
      - name: Generate API clients
        working-directory: clients/web
        run: bun run openapi-ts
      - name: Build
        working-directory: clients/web
        env:
          VITE_CLOUD_MODE: "false"
          VITE_WEB_MODE: "full"
          VITE_APP_VERSION: ${{ needs.compute-version.outputs.version }}
        run: bun run build
      - name: Rewrite package.json for publish
        working-directory: clients/web
        run: |
          VERSION="${{ needs.compute-version.outputs.version }}"
          jq --arg v "$VERSION" '{name, version: $v, license, type, description, files, repository}' package.json > tmp && mv tmp package.json
      - name: Pack tarball
        working-directory: clients/web
        run: |
          mkdir -p /tmp/npm-dist
          npm pack --pack-destination /tmp/npm-dist
          mv /tmp/npm-dist/*.tgz /tmp/npm-dist/package.tgz
      - name: Publish
        run: |
          PKG_NAME=$(node -p "require('./clients/web/package.json').name")
          PKG_VERSION=$(node -p "require('./clients/web/package.json').version")
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::notice::$PKG_NAME@$PKG_VERSION already published; skipping."
            exit 0
          fi
          npm publish /tmp/npm-dist/package.tgz --tag dev --access public
  publish-npm-app-dev:
    # Dev mirror of release.yml's publish-app-prod: the app shell bundle on
    # the dev channel, so `cadet tunnel --shell app` resolves @mycadet/app
    # from installed dev releases the same way it resolves @mycadet/web.
    needs: [compute-version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — no NPM_TOKEN
    environment: dev
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Stamp dev version
        run: jq --arg v "${{ needs.compute-version.outputs.version }}" '.version = $v' clients/app/package.json > clients/app/package.json.tmp && mv clients/app/package.json.tmp clients/app/package.json
      - name: Install dependencies
        run: |
          if ! bun install --frozen-lockfile --filter=@mycadet/app; then
            echo "bun install --frozen-lockfile failed; regenerating lockfile and retrying..."
            rm -f bun.lock
            rm -rf node_modules
            bun install --filter=@mycadet/app
          fi

      # Builds both publish outputs in one pass: dist/package (the portable
      # library its exports map serves) and dist/standalone (the outer-shell
      # bundle the CLI's nginx edge serves in app mode — findAppDistDir
      # resolves it from this package in installed releases).
      - name: Build
        working-directory: clients/app
        run: bun run build

      - name: Rewrite package.json for publish
        working-directory: clients/app
        run: |
          jq '{name, version, license, type, description, files, exports, repository}' package.json > tmp && mv tmp package.json

      - name: Pack tarball
        working-directory: clients/app
        run: |
          mkdir -p /tmp/npm-dist
          npm pack --pack-destination /tmp/npm-dist
          mv /tmp/npm-dist/*.tgz /tmp/npm-dist/package.tgz

      - name: Verify the standalone bundle is in the tarball
        run: |
          tar -tzf /tmp/npm-dist/package.tgz | grep -q "dist/standalone/index.html" || {
            echo "::error::@mycadet/app tarball is missing dist/standalone/index.html — the edge's app shell mode cannot resolve the bundle from installed releases."
            exit 1
          }

      - name: Publish
        run: |
          PKG_NAME=$(node -p "require('./clients/app/package.json').name")
          PKG_VERSION=$(node -p "require('./clients/app/package.json').version")
          EXPECTED_VERSION="${{ needs.compute-version.outputs.version }}"
          if [ "$PKG_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::$PKG_NAME is packaged as v$PKG_VERSION but this dev release is v$EXPECTED_VERSION. Refusing to skip/succeed without publishing v$EXPECTED_VERSION."
            exit 1
          fi
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::notice::$PKG_NAME@$PKG_VERSION already published; skipping (treating as retry)."
            exit 0
          fi
          npm publish /tmp/npm-dist/package.tgz --tag dev --access public

  publish-meta-dev:
    needs:
      [
        compute-version,
        publish-npm-app-dev,
        publish-npm-assistant-dev,
        publish-npm-cli-dev,
        publish-npm-credential-executor-dev,
        publish-npm-gateway-dev,
        publish-web-dev,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — no NPM_TOKEN
    environment: dev
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Stamp dev version into meta package.json
        run: |
          VERSION="${{ needs.compute-version.outputs.version }}"
          cd meta
          jq --arg v "$VERSION" '
            .version = $v |
            .bin = { "cadet-dev": .bin.cadet, "mycadet": .bin.mycadet, "assistant": .bin.assistant, "gateway": .bin.gateway } |
            .dependencies["@mycadet/app"] = $v |
            .dependencies["@mycadet/assistant"] = $v |
            .dependencies["@mycadet/cli"] = $v |
            .dependencies["@mycadet/credential-executor"] = $v |
            .dependencies["@mycadet/gateway"] = $v |
            .dependencies["@mycadet/web"] = $v
          ' package.json > tmp && mv tmp package.json
      - name: Generate npm-shrinkwrap.json
        run: ./scripts/npm-generate-meta-shrinkwrap.sh
      - name: Publish
        working-directory: meta
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::notice::$PKG_NAME@$PKG_VERSION already published; skipping."
            exit 0
          fi
          npm publish --tag dev --access public

  # ── iOS release (same-repo reusable workflow) ────────────────────────

  release-ios:
    needs: [compute-version, build-chrome-extension]
    continue-on-error: true # ios on the dev channel is a canary — a failed ios leg must not red the dev release
    uses: ./.github/workflows/release-ios.yaml
    with:
      environment: dev
      version: ${{ needs.compute-version.outputs.version }}
    secrets: inherit

  release-android:
    needs: [compute-version, build-chrome-extension]
    if: ${{ false }} # android offline on the dev channel; re-enable as vars.ANDROID_DEV_RELEASE_ENABLED == 'true' && delete this marker
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-android.yaml
    with:
      environment: dev
      version: ${{ needs.compute-version.outputs.version }}
    secrets: inherit

  build-windows:
    needs: [compute-version]
    if: ${{ false }} # windows offline on the dev channel; bring back online by deleting this marker
    permissions:
      contents: read
    uses: ./.github/workflows/release-windows.yaml
    with:
      environment: dev
      version: ${{ needs.compute-version.outputs.version }}
    secrets: inherit

  # ── Slack notification (first failure only) ──────────────────────────

