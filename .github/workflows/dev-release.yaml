          context: .
          file: credential-executor/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ steps.image.outputs.image }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=credential-executor-dev-${{ matrix.platform }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=credential-executor-dev-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Prepare platform suffix
        id: platform
        run: |
          platform="${{ matrix.platform }}"
          echo "suffix=${platform//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: credential-executor-digests-dev-${{ steps.platform.outputs.suffix }}
          path: /tmp/digests/*
          retention-days: 1

  push-credential-executor-manifest:
    needs: [compute-version, push-credential-executor-image]
    if: ${{ always() && !cancelled() && needs.push-credential-executor-image.result == 'success' }}
    outputs:
      repository: ${{ steps.tags.outputs.image_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
        run: echo "$DOCKERHUB_ACCESS_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: latest

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: credential-executor-digests-dev-*
          merge-multiple: true

      - name: Compute image tags
        id: tags
        run: |
          VERSION="${{ needs.compute-version.outputs.version }}"
          IMAGE_REF="docker.io/${{ secrets.DOCKERHUB_USER }}/${{ env.CREDENTIAL_EXECUTOR_IMAGE_NAME }}"
          IMAGE_TAGS="${IMAGE_REF}:${GITHUB_SHA}"
          IMAGE_TAGS=$(printf "%s\n%s" "$IMAGE_TAGS" "${IMAGE_REF}:${VERSION}")
          IMAGE_TAGS=$(printf "%s\n%s" "$IMAGE_TAGS" "${IMAGE_REF}:dev")
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            IMAGE_TAGS=$(printf "%s\n%s" "$IMAGE_TAGS" "${IMAGE_REF}:preview-v${VERSION}")
          fi
          echo "image_tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$IMAGE_TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          IMAGE="${{ steps.tags.outputs.image_name }}"
          TAG_ARGS=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAG_ARGS="$TAG_ARGS -t $tag"
          done <<< "${{ steps.tags.outputs.image_tags }}"
          SOURCES=$(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools create $TAG_ARGS $SOURCES

      - name: Export manifest digest
        id: manifest-digest
        run: |
          IMAGE="${{ steps.tags.outputs.image_name }}"
          VERSION="${{ needs.compute-version.outputs.version }}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/manifest-digest
          echo "${DIGEST}" > /tmp/manifest-digest/digest
          echo "${IMAGE}" > /tmp/manifest-digest/repository

      - name: Upload manifest digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: credential-executor-manifest-digest-dev
          path: /tmp/manifest-digest/*
          retention-days: 1

  # ── Web SPA (dev bucket) ─────────────────────────────────────────────
  # The platform SPA ships to the dev GCS bucket with every dev release,
  # not on merge to main; staging/production deploys live in release.yml.
  #
  # ci-web is the only hard gate: a dev release must always get the web changes
  # onto the dev instance, even when the backend half of the release does not
  # land. The push-*-manifest jobs stay in `needs` purely for *ordering* — when
  # the backend images do ship, the SPA still publishes after them, so the dev
  # UI is never pushed ahead of a backend that shipped in the same run. But the
  # `if` deliberately uses a status function, which drops the implicit
  # success() check on every `needs` entry: a failed or skipped manifest push
  # (backend CI red, a Docker build failure) no longer strands green web
  # commits outside dev until the next run happens to be fully green.
  #
  # The platform learns about dev releases by pulling from Docker Hub itself;
  # this workflow no longer registers anything with the platform API.
  #
  # The trade-off is accepted on dev only: a dev SPA can briefly run against the
  # previously-released dev backend. Staging and production keep the strict
  # gating in release.yml, where a UI ahead of its backend actually matters.
  #
  # !cancelled() (rather than always()) keeps this quiet when a run is
  # superseded by the next release via concurrency.cancel-in-progress.
  deploy-web-spa:
    name: Deploy Web SPA (dev)
    needs: [parse-exclude, ci-web, push-assistant-manifest, push-gateway-manifest, push-credential-executor-manifest]
    if: ${{ !cancelled() && !contains(fromJSON(needs.parse-exclude.outputs.excluded), 'web') && needs.ci-web.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-platform-web-spa.yaml
    with:
      environment: dev
    secrets: inherit

  # ── Web SPA (production preview channel) ─────────────────────────────
  # Publishes the preview UI into the PRODUCTION bucket under `/preview/` on
  # every dev release, leaving the stable root index.html untouched. The
  # bundle self-identifies via VITE_CHANNEL=preview; its version is the commit
  # SHA. Gating matches deploy-web-spa above. The ref guard matches the other
  # production-preview jobs so a release-branch dispatch cannot publish here.
  deploy-web-spa-preview:
    name: Deploy Web SPA (production /preview)
    needs: [parse-exclude, ci-web, push-assistant-manifest, push-gateway-manifest, push-credential-executor-manifest]
    if: ${{ !cancelled() && github.ref_name == 'main' && !contains(fromJSON(needs.parse-exclude.outputs.excluded), 'web') && needs.ci-web.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-platform-web-spa.yaml
    with:
      environment: production
      channel: preview
    secrets: inherit

  # ── Notify #dev-releases (changelog on success, alert on failure) ──────
  # Runs on every completed (non-cancelled) run. The dev release is considered
  # successful when the three image manifest pushes succeeded — the same
  # signal the changelog uses to anchor its diff — so a failure in a downstream
  # job (e.g. build-electron) still posts the success changelog.
  #
  # On success: posts a single summary message. The top-level blocks carry the
  # header, the "*N commits* since the last dev release" line, and the action
  # buttons; the ordered commit list (message + author) lives in a Slack
  # *attachment* below it. Per Slack's docs, attachment content may be
  # "wrapped, truncated, or hidden behind a 'show more' style option" by
  # clients — which is exactly the toggle behaviour we want here. The channel
  # stays tidy even when a release spans many commits. The diff is taken
  # since the last *successful* dev release (skipping any intervening failed
  # runs), so no commits are dropped.
  #
  # On failure: posts a short alert without a changelog.
  #
  # Posts via a #dev-releases incoming webhook stored in the repo secret
  # SLACK_DEV_RELEASES_WEBHOOK_URL. The channel is baked into the webhook URL
  # (incoming webhooks ignore a payload `channel` field), so each channel needs
  # its own webhook — mirroring SLACK_WEBHOOK_URL (#build-alerts) and
  # SLACK_RELEASES_WEBHOOK_URL (releases). The job no-ops if the secret is unset.

  notify-dev-release:
    needs:
      [
        compute-version,
        push-assistant-manifest,
        push-gateway-manifest,
        push-credential-executor-manifest,
        build-electron,
        upload-electron-updates,
        deploy-web-spa,
        deploy-web-spa-preview,
      ]
    # Run on success and failure alike, but not when the run was cancelled
    # (e.g. superseded by a newer run via cancel-in-progress) — a
    # cancelled run is not a real failure and should not alert the channel.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    # A Slack outage must not fail the release run: that would both mar the run
    # conclusion (poisoning notify-releases' first-failure detection) and is
    # purely a notification concern. Mirrors notify-releases below.
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Build Slack payload
        id: build
        # A payload-building bug must not prevent the notification from going
        # out — the fallback step below sends a minimal message instead.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.SLACK_DEV_RELEASES_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.compute-version.outputs.version }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Treat the dev release as successful iff all three dev image
          # manifests landed on Docker Hub. This is the same anchor the
          # changelog walk-back uses below, so a failure downstream of the
          # image pushes (e.g. build-electron) still posts the changelog.
          RELEASE_RESULT: ${{ needs.push-assistant-manifest.result == 'success' && needs.push-gateway-manifest.result == 'success' && needs.push-credential-executor-manifest.result == 'success' && 'success' || 'failure' }}
          ELECTRON_RESULT: ${{ needs.build-electron.result }}
          UPDATES_RESULT: ${{ needs.upload-electron-updates.result }}
          SPA_RESULT: ${{ needs.deploy-web-spa.result }}
          PREVIEW_SPA_RESULT: ${{ needs.deploy-web-spa-preview.result }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK:-}" ]; then
            echo "::warning::SLACK_DEV_RELEASES_WEBHOOK_URL is not set — skipping #dev-releases notification."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          # ── Failure path ──────────────────────────────────────────────────
          # The dev image manifests did not land (job failed, was skipped
          # because an upstream image build failed, etc.). Post a short alert without a
          # changelog and skip the commit diffing entirely.
          #
          # The SPA deploy is gated on ci-web alone, so it can (and should) have
          # shipped even on this path. Say which half actually landed, or the
          # alert reads as "nothing reached dev" while the dev web UI has in
          # fact just moved to this commit.
          if [ "${RELEASE_RESULT}" != "success" ]; then
            echo "dev image manifests result: ${RELEASE_RESULT} — building failure notification."
            if [ "${SPA_RESULT}" = "success" ]; then
              SPA_SENTENCE="The web SPA *was* deployed, so the dev web UI is now on this commit, but it is running against the previously-released backend."
            else
              SPA_SENTENCE="The web SPA was not deployed either (result: ${SPA_RESULT}), so the dev web UI is unchanged."
            fi
            jq -n \
              --arg run_url "$RUN_URL" \
              --arg body "The dev release run failed — no new dev backend images were pushed to Docker Hub. ${SPA_SENTENCE} See the workflow run for details." \
              '{
                unfurl_links: false,
                unfurl_media: false,
                text: "Dev Release failed",
                blocks: [
                  { type: "header", text: { type: "plain_text", text: "🚨 Dev Release failed", emoji: true } },
                  { type: "section", text: { type: "mrkdwn", text: $body } },
                  { type: "actions", elements: [
                    { type: "button", text: { type: "plain_text", text: "View workflow run" }, url: $run_url }
                  ] }
                ]
              }' > "${RUNNER_TEMP}/dev-release-slack-payload.json"
            echo "Built Slack failure payload."
            exit 0
          fi

          # Find the SHA of the last actually-released dev build to diff against.
          # We key off the image manifest-push JOB conclusions, not the overall
          # run conclusion: the manifest pushes run before downstream jobs
          # (build-electron, …), so a later failure leaves a real release on a
          # run whose conclusion is "failure". Keying off the run would then
          # diff from an older SHA and re-announce already-released commits.
          # Walk recent completed runs newest-first and pick the first whose
          # manifest pushes all succeeded.
          #
          # The jobs listing MUST be paginated: this workflow has >30 jobs and
          # the API defaults to 30 per page, so the anchor job lands on page 2
          # and an unpaginated call silently yields an empty conclusion, which
          # degrades to the single-commit fallback below. The runs listing is
          # bounded rather than fully paginated.
          PREV_SHA=""
          while read -r rid rsha; do
            [ -z "$rid" ] && continue
            # Best-effort: a per-run API failure must not abort the notification
            # step, which would drop the Slack message for a real release
            # entirely. Skip that run and keep walking.
            if ! CONCL=$(gh api "repos/${REPO}/actions/runs/${rid}/jobs?per_page=100" --paginate \
              --jq '[.jobs[] | select(.name == "push-assistant-manifest") | .conclusion] | .[0] // empty'); then
              echo "::warning::Could not read jobs for run ${rid}; skipping it in the dev-release walk-back."
              continue
            fi
            if [ "$CONCL" = "success" ]; then
              PREV_SHA="$rsha"
              break
            fi
          done < <(gh api \
            "repos/${REPO}/actions/workflows/dev-release.yaml/runs?branch=main&status=completed&per_page=100&exclude_pull_requests=true" \
            --jq ".workflow_runs[] | select(.id != ${RUN_ID} and .conclusion != \"cancelled\") | \"\(.id) \(.head_sha)\"")

          echo "Previous dev release SHA: ${PREV_SHA:-<none>}"
          echo "Current SHA: ${HEAD_SHA}"

          # Each line: "<first line of commit message> — @<author>", oldest first.
          # Escape Slack mrkdwn metacharacters in the message text.
          # When the commit author is a bot (e.g. devin-ai-integration[bot]),
          # use the first human Co-authored-by email instead.
          ESCAPE='gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;")'
          LINKIFY='gsub("\\(#(?<n>[0-9]+)\\)"; "(<https://github.com/'"${REPO}"'/pull/\(.n)|#\(.n)>)")'
          RESOLVE_AUTHOR='if ((.author.login // "") | test("\\[bot\\]$")) then (([.commit.message | scan("(?i)co-authored-by:\\s*[^<]*<([^>]+)>")] | map(.[0]) | map(select(test("\\[bot\\]") | not)) | .[0]) // .author.login) else (.author.login // .commit.author.name) end'
          # Prefix "@" only for GitHub logins. Email-style authors (resolved from
          # a Co-authored-by trailer, e.g. "user@example.com") are left bare so
          # Slack doesn't render a leading "@" + email as a noisy keyword mention.
          MENTION='if test("@") then . else "@" + . end'

          if [ -n "$PREV_SHA" ] && [ "$PREV_SHA" != "$HEAD_SHA" ]; then
            COMPARE_URL="https://github.com/${REPO}/compare/${PREV_SHA}...${HEAD_SHA}"
            TOTAL=$(gh api "repos/${REPO}/compare/${PREV_SHA}...${HEAD_SHA}" --jq '.total_commits')
            mapfile -t LINES < <(gh api "repos/${REPO}/compare/${PREV_SHA}...${HEAD_SHA}" --paginate \
              --jq ".commits[] | (${RESOLVE_AUTHOR}) as \$a | \"\((.commit.message | split(\"\n\")[0]) | ${ESCAPE} | ${LINKIFY}) — \(\$a | ${MENTION})\"")
          else
            # First tracked release (or no new commits): fall back to HEAD itself.
            COMPARE_URL="https://github.com/${REPO}/commit/${HEAD_SHA}"
            if [ "$PREV_SHA" = "$HEAD_SHA" ]; then
              TOTAL=0
              LINES=()
            else
              TOTAL=1
              mapfile -t LINES < <(gh api "repos/${REPO}/commits/${HEAD_SHA}" \
                --jq "(${RESOLVE_AUTHOR}) as \$a | \"\((.commit.message | split(\"\n\")[0]) | ${ESCAPE} | ${LINKIFY}) — \(\$a | ${MENTION})\"")
            fi
          fi

          COUNT=${#LINES[@]}
          echo "Commits listed: ${COUNT} (total_commits=${TOTAL})"

          COMMIT_WORD="commits"
          [ "$TOTAL" = "1" ] && COMMIT_WORD="commit"
          if [ "$COUNT" -eq 0 ]; then
            HEADER_TEXT="No new commits since the last dev release."
          else
            HEADER_TEXT="*${TOTAL} ${COMMIT_WORD}* since the last dev release"
          fi

          # ── Build the message blocks ──────────────────────────────────────
          # Top-level blocks: header, "N commits since last dev release", buttons.
          # Commit list lives in an attachment so Slack auto-collapses it behind
          # a "show more" toggle (see Slack docs on attachments truncation).
          # When the image manifests pushed but the Electron build, the Electron
          # update feed upload, or either web SPA publish did not succeed, swap the
          # header emoji and append a warning so the notification surfaces the
          # failure instead of looking fully green. The warnings are
          # independent — any subset can fire (e.g. a build-electron failure
          # also skips upload-electron-updates, so both of those warnings fire
          # together, which is accurate).
          HEADER_EMOJI="🚀"
          if [ "${ELECTRON_RESULT}" != "success" ]; then
            HEADER_EMOJI="⚠️"
            # Build with jq so the value is real JSON — --argjson rejects
            # jq-program syntax like unquoted object keys.
            ELECTRON_WARNING=$(jq -n '{ type: "section", text: { type: "mrkdwn", text: "⚠️ *Electron build failed* — the release was published but the desktop app was not built. See the workflow run for details." } }')
          else
            ELECTRON_WARNING=""
          fi

          if [ "${UPDATES_RESULT}" != "success" ]; then
            HEADER_EMOJI="⚠️"
            UPDATES_WARNING=$(jq -n --arg result "$UPDATES_RESULT" '{ type: "section", text: { type: "mrkdwn", text: ("⚠️ *Electron update feed was not published* (result: " + $result + ") — the release shipped but desktop clients will not auto-update to it. See the workflow run for details.") } }')
          else
            UPDATES_WARNING=""
          fi

          if [ "${SPA_RESULT}" != "success" ]; then
            HEADER_EMOJI="⚠️"
            SPA_WARNING=$(jq -n --arg result "$SPA_RESULT" '{ type: "section", text: { type: "mrkdwn", text: ("⚠️ *Web SPA was not deployed* (result: " + $result + ") — the release was published but the dev web UI was not updated. See the workflow run for details.") } }')
          else
            SPA_WARNING=""
          fi

          # `skipped` is quiet: the job skips off main, and a ci-web failure is
          # already covered by the dev SPA warning above.
          if [ "${PREVIEW_SPA_RESULT}" != "success" ] && [ "${PREVIEW_SPA_RESULT}" != "skipped" ]; then
            HEADER_EMOJI="⚠️"
            PREVIEW_SPA_WARNING=$(jq -n --arg result "$PREVIEW_SPA_RESULT" '{ type: "section", text: { type: "mrkdwn", text: ("⚠️ *Preview web SPA was not published* (result: " + $result + "). The dev release shipped but prod `/preview/` is unchanged. See the workflow run for details.") } }')
          else
            PREVIEW_SPA_WARNING=""
          fi

          BLOCKS=$(jq -n \
            --arg version "$VERSION" \
            --arg header "$HEADER_TEXT" \
            --arg run_url "$RUN_URL" \
            --arg compare_url "$COMPARE_URL" \
            --arg emoji "$HEADER_EMOJI" \
            '[
              { type: "header", text: { type: "plain_text", text: ($emoji + " Dev Release " + $version), emoji: true } },
              { type: "section", text: { type: "mrkdwn", text: $header } },
              { type: "actions", elements: [
                { type: "button", text: { type: "plain_text", text: "View workflow run" }, url: $run_url },
                { type: "button", text: { type: "plain_text", text: "View commit diff" }, url: $compare_url }
              ] }
            ]')

          if [ -n "$ELECTRON_WARNING" ]; then
            BLOCKS=$(echo "$BLOCKS" | jq --argjson warn "$ELECTRON_WARNING" '. += [$warn]')
          fi

          if [ -n "$UPDATES_WARNING" ]; then
            BLOCKS=$(echo "$BLOCKS" | jq --argjson warn "$UPDATES_WARNING" '. += [$warn]')
          fi

          if [ -n "$SPA_WARNING" ]; then
            BLOCKS=$(echo "$BLOCKS" | jq --argjson warn "$SPA_WARNING" '. += [$warn]')
          fi

          if [ -n "$PREVIEW_SPA_WARNING" ]; then
            BLOCKS=$(echo "$BLOCKS" | jq --argjson warn "$PREVIEW_SPA_WARNING" '. += [$warn]')
          fi

          # Attachment blocks: the actual commit list, chunked into sections to
          # respect Slack's 3000-char-per-section limit.
          ATTACHMENT_BLOCKS='[]'
          append_attachment_section() {
            ATTACHMENT_BLOCKS=$(echo "$ATTACHMENT_BLOCKS" | jq --arg t "$1" \
              '. + [{ type: "section", text: { type: "mrkdwn", text: $t } }]')
          }

          if [ "$COUNT" -gt 0 ]; then
            CHUNK=""
            IDX=0
            for line in "${LINES[@]}"; do
              IDX=$((IDX + 1))
              ENTRY="${IDX}. ${line}"
              if [ -n "$CHUNK" ] && [ $(( ${#CHUNK} + ${#ENTRY} + 1 )) -gt 2800 ]; then
                append_attachment_section "$CHUNK"
                CHUNK="$ENTRY"
              elif [ -z "$CHUNK" ]; then
                CHUNK="$ENTRY"
              else
                CHUNK="${CHUNK}"$'\n'"${ENTRY}"
              fi
            done
            [ -n "$CHUNK" ] && append_attachment_section "$CHUNK"

            if [ "$TOTAL" -gt "$COUNT" ]; then
              ATTACHMENT_BLOCKS=$(echo "$ATTACHMENT_BLOCKS" | jq \
                --arg t "_…and $((TOTAL - COUNT)) more commits not shown (GitHub compares are capped at 250 commits). See *View commit diff* above for the full list._" \
                '. + [{ type: "context", elements: [{ type: "mrkdwn", text: $t }] }]')
            fi
          fi

          # No `channel` field: incoming webhooks ignore it and post to the
          # channel baked into SLACK_DEV_RELEASES_WEBHOOK_URL (#dev-releases).
          # Attach the commit list only when there's something to show — Slack
          # renders empty attachments as a bare colored bar otherwise.
          jq -n \
            --arg version "$VERSION" \
            --argjson blocks "$BLOCKS" \
            --argjson attachment_blocks "$ATTACHMENT_BLOCKS" \
            '{
              unfurl_links: false,
              unfurl_media: false,
              text: ("Dev Release " + $version),
              blocks: $blocks
            }
            + (if ($attachment_blocks | length) > 0
               then { attachments: [{ color: "#1f6feb", blocks: $attachment_blocks }] }
               else {} end)' > "${RUNNER_TEMP}/dev-release-slack-payload.json"

          echo "Built Slack payload (${COUNT} commits listed)."

      - name: Fall back to a minimal payload if the build step failed
        if: steps.build.outputs.skip != 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -s "${RUNNER_TEMP}/dev-release-slack-payload.json" ]; then
            exit 0
          fi
          echo "::warning::Slack payload build failed — sending a minimal fallback notification."
          jq -n \
            --arg version "$VERSION" \
            --arg run_url "$RUN_URL" \
            '{
              unfurl_links: false,
              unfurl_media: false,
              text: ("Dev Release " + $version),
              blocks: [
                { type: "header", text: { type: "plain_text", text: ("⚠️ Dev Release " + $version), emoji: true } },
                { type: "section", text: { type: "mrkdwn", text: "A new dev release was published, but building the full changelog notification failed. See the workflow run for details." } },
                { type: "actions", elements: [
                  { type: "button", text: { type: "plain_text", text: "View workflow run" }, url: $run_url }
                ] }
              ]
            }' > "${RUNNER_TEMP}/dev-release-slack-payload.json"

      - name: Notify Slack
        id: slack
        if: steps.build.outputs.skip != 'true'
        continue-on-error: true
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          webhook: ${{ secrets.SLACK_DEV_RELEASES_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: ${{ runner.temp }}/dev-release-slack-payload.json
          errors: true

      - name: Log Slack notification result
        if: always() && steps.build.outputs.skip != 'true'
        run: |
          echo "Slack step outcome: ${{ steps.slack.outcome }}"
          if [ "${{ steps.slack.outcome }}" != "success" ]; then
            echo "::warning::#dev-releases notification failed to send."
          fi

  # ── Chrome Extension ────────────────────────────────────────────────────

  build-chrome-extension:
    needs: [parse-exclude, compute-version]
    if: ${{ !contains(fromJSON(needs.parse-exclude.outputs.excluded), 'chrome-extension') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        working-directory: clients/chrome-extension
        run: bun install --frozen-lockfile

      - name: Build extension
        working-directory: clients/chrome-extension
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
          CADET_ENVIRONMENT: dev
        run: bash build.sh

      - name: Upload extension zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dev-chrome-extension
          path: clients/chrome-extension/cadet-browser-relay.zip
          retention-days: 30

  # ── Electron DMG ──────────────────────────────────────────────────────

  build-electron:
    # No publish dep: the bundled CLI floats to the `dev` dist-tag at runtime.
    needs: [parse-exclude, compute-version]
    if: ${{ !contains(fromJSON(needs.parse-exclude.outputs.excluded), 'electron') }}
    runs-on: macos-26
    timeout-minutes: 30
    # Resolves the environment-scoped STRIPE_PUBLISHABLE_KEY secret baked into
    # the renderer below.
    environment: dev
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            dmg_name: mycadet-electron-dev.dmg
            artifact_name: dev-electron-dmg
            update_artifact_name: dev-electron-update-arm64
            experimental: false
          - arch: x64
            dmg_name: mycadet-electron-dev-x64.dmg
            artifact_name: dev-electron-dmg-x64
            update_artifact_name: dev-electron-update-x64
            experimental: true
    defaults:
      run:
        working-directory: clients/macos
    env:
      KEYCHAIN_NAME: build-electron.keychain
      KEYCHAIN_PASSWORD: temporary-ci-password
      ELECTRON_TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Import code-signing certificate
        env:
          CERT_P12: ${{ secrets.DEVID_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME-db"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERT_P12" | base64 -D > /tmp/certificate.p12
          security import /tmp/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm /tmp/certificate.p12

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Verify signing identity
        run: |
          security find-identity -v -p codesigning | grep -q "Developer ID Application" \
            || { echo "::error::Developer ID Application identity not found"; exit 1; }

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          if ! bun install --frozen-lockfile --filter=@mycadet/macos --filter=@mycadet/web; then
            rm -f bun.lock && rm -rf node_modules && bun install --filter=@mycadet/macos --filter=@mycadet/web
          fi

      # Installing does not download the Electron binary or build the mac
      # helper, so packaging provisions them explicitly.
      - name: Set up Electron binary and mac helper
        run: bun run setup

      - name: Stamp dev version into package.json
        run: jq --arg v "${{ needs.compute-version.outputs.version }}" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json

      # The Communication Notifications entitlement is restricted: it may only
      # be signed into a build that embeds a provisioning profile authorizing
      # it for that build's bundle id. Without the secret the pack signs the
      # plain entitlements and posts plain notifications.
      - name: Provision the Communication Notifications profile
        env:
          MAC_PROVISIONING_PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
          # electron-builder.config.cjs derives the app id from
          # CADET_ENVIRONMENT, and the pack step below runs --environment dev.
          EXPECTED_BUNDLE_ID: com.mycadet.mycadet-electron-dev
        run: |
          if [ -z "$MAC_PROVISIONING_PROFILE" ]; then
            echo "::warning::MAC_PROVISIONING_PROFILE is unset, so the native notifier ships disabled: notifications post through Electron without the assistant avatar."
            exit 0
          fi
          PROFILE_PATH="$RUNNER_TEMP/cadet-communication.provisionprofile"
          echo "$MAC_PROVISIONING_PROFILE" | base64 -D > "$PROFILE_PATH"
          DECODED_PATH="$RUNNER_TEMP/cadet-communication-profile.plist"
          # A truncated or mis-encoded secret decodes to a file that codesign
          # accepts and macOS then rejects at launch, so prove it parses here.
          if ! security cms -D -i "$PROFILE_PATH" > "$DECODED_PATH"; then
            echo "::error::MAC_PROVISIONING_PROFILE does not decode as a provisioning profile. Re-export the .provisionprofile from the Apple Developer portal and store it base64-encoded in the secret."
            exit 1
          fi
          # Exporting the variable below makes the pack sign
          # com.apple.developer.usernotifications.communication unconditionally,
          # and macOS kills an app whose embedded profile does not authorize
          # that entitlement for its bundle id. Parsing is therefore not enough.
          GRANTED="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.usernotifications.communication" "$DECODED_PATH" 2>/dev/null || true)"
          if [ "$GRANTED" != "true" ]; then
            echo "::error::The provisioning profile does not grant com.apple.developer.usernotifications.communication. Enable Communication Notifications on the $EXPECTED_BUNDLE_ID App ID in the Apple Developer portal, regenerate the profile, and update the MAC_PROVISIONING_PROFILE secret."
            exit 1
          fi
          # A macOS profile carries the app id under
          # com.apple.application-identifier; the bare key is the iOS shape,
          # which some older exports still use.
          APPLICATION_ID="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.application-identifier" "$DECODED_PATH" 2>/dev/null || true)"
          if [ -z "$APPLICATION_ID" ]; then
            APPLICATION_ID="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$DECODED_PATH" 2>/dev/null || true)"
          fi
          if [ -z "$APPLICATION_ID" ]; then
            echo "::error::The provisioning profile carries no application-identifier entitlement, so the bundle id it authorizes cannot be read. Re-export the .provisionprofile for the $EXPECTED_BUNDLE_ID App ID and update the MAC_PROVISIONING_PROFILE secret."
            exit 1
          fi
          case "$APPLICATION_ID" in
            *".$EXPECTED_BUNDLE_ID") ;;
            *)
              echo "::error::The provisioning profile authorizes '$APPLICATION_ID', not the '$EXPECTED_BUNDLE_ID' bundle this build packages. Regenerate the profile for that App ID and update the MAC_PROVISIONING_PROFILE secret."
              exit 1
              ;;
          esac
          echo "CADET_MAC_PROVISIONING_PROFILE=$PROFILE_PATH" >> "$GITHUB_ENV"

      - name: Build and package Electron app
        env:
          CSC_NAME: Developer ID Application
          VITE_PLATFORM_MODE: "false"
          VITE_ENVIRONMENT: dev
          VITE_SESSION_REPLAY_APP_ID: ${{ vars.VITE_SESSION_REPLAY_APP_ID }}
          # Environment-scoped secret (pk_test_ on dev); requires the job's
          # `environment: dev` above, else it resolves empty and the
          # payment-method modal can't mount Stripe Elements. Publishable keys
          # are public, so embedding them is expected.
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          VITE_APP_VERSION: ${{ needs.compute-version.outputs.version }}
          # A source-map upload failure degrades to a warning instead of failing
          # the dev-release build (see clients/web/vite.config.ts).
        run: bun run pack --environment dev

      - name: Rename DMG for release
        id: dmg
        run: |
          ELECTRON_DMG=$(find dist -name "*.dmg" -type f | grep -m1 .)
          if [ -z "$ELECTRON_DMG" ]; then
            echo "::error::No DMG found in dist/"
            ls -la dist/
            exit 1
          fi
          echo "Found DMG: $ELECTRON_DMG"
          FINAL_DMG="dist/${{ matrix.dmg_name }}"
          mv "$ELECTRON_DMG" "$FINAL_DMG"
          echo "dmg_path=$FINAL_DMG" >> "$GITHUB_OUTPUT"

      - name: Sign DMG
        run: |
          codesign --sign "Developer ID Application" \
            --timestamp \
            "${{ steps.dmg.outputs.dmg_path }}"
          codesign --verify --verbose "${{ steps.dmg.outputs.dmg_path }}"

      - name: Notarize DMG
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/.private_keys
          echo "$ASC_KEY_P8" > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8

          echo "Submitting Electron DMG for notarization..."
          NOTARIZE_OUTPUT=$(xcrun notarytool submit "${{ steps.dmg.outputs.dmg_path }}" \
            --key ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait \
            --timeout 30m \
            2>&1) || NOTARIZE_FAILED=true

          echo "$NOTARIZE_OUTPUT"

          SUBMISSION_ID=$(echo "$NOTARIZE_OUTPUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | grep -m1 .)

          if [ "$NOTARIZE_FAILED" = "true" ] || echo "$NOTARIZE_OUTPUT" | grep -q "status: Invalid"; then
            echo "::error::Electron notarization failed"
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --key ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8 \
                --key-id "$ASC_KEY_ID" \
                --issuer "$ASC_ISSUER_ID" \
                || echo "::warning::Could not fetch notarization log"
            fi
            exit 1
          fi

      - name: Staple notarization ticket
        run: |
          MAX_ATTEMPTS=15
          WAIT_SECS=60
          for i in $(seq 1 $MAX_ATTEMPTS); do
            STAPLE_OUTPUT=$(xcrun stapler staple "${{ steps.dmg.outputs.dmg_path }}" 2>&1)
            STAPLE_EXIT=$?
            if [ $STAPLE_EXIT -eq 0 ]; then
              echo "Stapling succeeded on attempt $i"
              echo "$STAPLE_OUTPUT"
              break
            fi
            echo "::warning::Stapling attempt $i/$MAX_ATTEMPTS failed (exit code $STAPLE_EXIT):"
            echo "$STAPLE_OUTPUT"
            if [ "$i" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Stapling failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            echo "Waiting ${WAIT_SECS}s for CDN propagation..."
            sleep $WAIT_SECS
            WAIT_SECS=$((WAIT_SECS + 15))
          done

          xcrun stapler validate "${{ steps.dmg.outputs.dmg_path }}"

      - name: Upload Electron DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: clients/macos/dist/${{ matrix.dmg_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Electron update artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.update_artifact_name }}
          path: |
            clients/macos/dist/*-mac.yml
            clients/macos/dist/*.zip
            clients/macos/dist/*.zip.blockmap
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup keychain and keys
        if: always()
        run: |
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME-db"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -rf ~/.private_keys 2>/dev/null || true

  # ── Upload Electron update artifacts to GCS ────────────────────────────
  # Push per-arch update feeds (manifest + ZIP + blockmap) to the public
  # GCS bucket so electron-updater can pull delta updates. Each arch gets
  # its own path: mac-electron/dev/{arch}/.

  upload-electron-updates:
    # Gate the GCS update-feed publish (an external side effect) on the dev meta
    # publish: never offer an auto-update for a release that didn't publish.
    needs: [compute-version, build-electron, publish-meta-dev]
    if: ${{ always() && !cancelled() && needs.build-electron.result == 'success' && needs.publish-meta-dev.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download arm64 update artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dev-electron-update-arm64
          path: electron-artifacts/arm64

      - name: Download x64 update artifacts
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dev-electron-update-x64
          path: electron-artifacts/x64

      - name: Validate update artifacts
        run: |
          DIR="electron-artifacts/arm64"
          if [ ! -f "$(find "$DIR" -name '*-mac.yml' -type f 2>/dev/null | grep -m1 .)" ]; then
            echo "::error::Missing update manifest (*-mac.yml) for arm64"
            exit 1
          fi
          if [ -z "$(find "$DIR" -name '*.zip' -type f ! -name '*.blockmap' 2>/dev/null | grep -m1 .)" ]; then
            echo "::error::Missing ZIP for arm64"
            exit 1
          fi

      - name: Upload Electron update artifacts to the sandbox updates store
        env:
          RCLONE_CREDENTIALS: ${{ secrets.SANDBOX_UPDATES_STORAGE_CREDENTIALS }}
          BUCKET: ${{ secrets.SANDBOX_UPDATES_BUCKET }}
        run: |
          MANIFEST_NAME="dev-mac.yml"

          for ARCH in arm64 x64; do
            ARCH_DIR="electron-artifacts/${ARCH}"
            [ -d "$ARCH_DIR" ] || continue
            PREFIX="mac-electron/${ARCH}"

            find "$ARCH_DIR" -type f \( -name "*.zip" -o -name "*.zip.blockmap" -o -name "*-mac.yml" \) | while read -r FILE; do
              [ -z "$FILE" ] && continue
              docker run --rm \
                -v "$PWD:/work" -w /work \
                -e RCLONE_CONFIG_REMOTE_TYPE=googlecloudstorage \
                -e RCLONE_CONFIG_REMOTE_SERVICE_ACCOUNT_CREDENTIALS="$RCLONE_CREDENTIALS" \
                -e RCLONE_CONFIG_REMOTE_BUCKET_POLICY_ONLY=true \
                rclone/rclone:1.69.1 copyto "/work/$FILE" "remote:$BUCKET/$PREFIX/$(basename "$FILE")"
            done
          done

  # ── Dev npm publishing ─────────────────────────────────────────────────

  build-npm-dev:
    needs:
      [
        compute-version,
        ci-assistant-lint,
        ci-assistant-types,
        ci-assistant-tests,
        ci-cli,
        ci-gateway,
        ci-credential-executor,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        package: [assistant, cli, credential-executor, gateway]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Sync feature flag registry
        run: bun run meta/sync-bundled-copies.ts
      - name: Stamp dev version
        run: jq --arg v "${{ needs.compute-version.outputs.version }}" '.version = $v' ${{ matrix.package }}/package.json > ${{ matrix.package }}/package.json.tmp && mv ${{ matrix.package }}/package.json.tmp ${{ matrix.package }}/package.json
      - name: Install package dependencies
        run: |
          if ! bun install --frozen-lockfile --filter="./${{ matrix.package }}"; then
            rm -f bun.lock && rm -rf node_modules && bun install --filter="./${{ matrix.package }}"
          fi
      - name: Strip bundled deps from the manifest
        run: bun scripts/strip-bundled-deps.mjs "${{ matrix.package }}"
      - name: Pack tarball
        run: |
          cd "${{ matrix.package }}"
          mkdir -p /tmp/npm-dist
          bun pm pack --destination /tmp/npm-dist
          mv /tmp/npm-dist/*.tgz /tmp/npm-dist/package.tgz
          bun ../scripts/strip-bundled-field-from-tarball.mjs /tmp/npm-dist/package.tgz
          node -p "require('./package.json').name" > /tmp/npm-dist/name
          node -p "require('./package.json').version" > /tmp/npm-dist/version
      - name: Upload tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarball-dev-${{ matrix.package }}
          path: /tmp/npm-dist/
          retention-days: 1

  publish-npm-dev:
    needs: [compute-version, build-npm-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — no NPM_TOKEN
    strategy:
      matrix:
        package: [assistant, cli, credential-executor, gateway]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Download tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarball-dev-${{ matrix.package }}
          path: /tmp/npm-dist
      - name: Publish package
        run: |
          PKG_NAME=$(cat /tmp/npm-dist/name)
          PKG_VERSION=$(cat /tmp/npm-dist/version)
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::notice::$PKG_NAME@$PKG_VERSION already published; skipping."
            exit 0
          fi
          npm publish /tmp/npm-dist/package.tgz --tag dev --access public

  # `@mycadet/plugin-api` is generated by scripts/build-plugin-api.ts (a single
  # self-contained `index.d.ts` rollup, zod-only external), not a package dir
  # `npm pack` consumes directly, so it gets its own build/publish pair instead
  # of a slot in the npm matrix. Mirrors build/publish-plugin-api-* in release.yml.
  build-plugin-api-dev:
    needs:
      [
        compute-version,
        ci-assistant-lint,
        ci-assistant-types,
        ci-assistant-tests,
        ci-cli,
        ci-gateway,
        ci-credential-executor,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: |
          if ! bun install --frozen-lockfile --filter=@mycadet/assistant; then
            echo "bun install --frozen-lockfile failed; regenerating lockfile and retrying..."
            rm -f bun.lock
            bun install --filter=@mycadet/assistant
          fi
      - name: Build plugin-api package
        run: cd assistant && bun run scripts/build-plugin-api.ts --version "${{ needs.compute-version.outputs.version }}"
      - name: Pack tarball
        run: |
          cd assistant/.plugin-api-build/package
          mkdir -p /tmp/npm-dist
          npm pack --pack-destination /tmp/npm-dist
          mv /tmp/npm-dist/*.tgz /tmp/npm-dist/package.tgz
          node -p "require('./package.json').name" > /tmp/npm-dist/name
          node -p "require('./package.json').version" > /tmp/npm-dist/version
      - name: Upload tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarball-dev-plugin-api
          path: /tmp/npm-dist/
          retention-days: 1

  publish-plugin-api-dev:
    needs: [compute-version, build-plugin-api-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — no NPM_TOKEN
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Download tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarball-dev-plugin-api
          path: /tmp/npm-dist
      - name: Publish package
        run: |
          PKG_NAME=$(cat /tmp/npm-dist/name)
          PKG_VERSION=$(cat /tmp/npm-dist/version)
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::notice::$PKG_NAME@$PKG_VERSION already published; skipping."
            exit 0
          fi
          npm publish /tmp/npm-dist/package.tgz --tag dev --access public

  build-web-dev:
    needs:
      [
        compute-version,
        ci-assistant-lint,
        ci-assistant-types,
        ci-assistant-tests,
        ci-cli,
        ci-gateway,
        ci-credential-executor,
        ci-web,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Install design-library dependencies
        working-directory: packages/design-library
        run: bun install --frozen-lockfile --filter=@mycadet/design-library
      - name: Install web dependencies
        working-directory: clients/web
        run: |
          if ! bun install --frozen-lockfile --filter=@mycadet/web; then
            rm -f bun.lock && rm -rf node_modules && bun install --filter=@mycadet/web
          fi
      - name: Generate API clients
        working-directory: clients/web
        run: bun run openapi-ts
      - name: Build
        working-directory: clients/web
        env:
          VITE_PLATFORM_MODE: "false"
        run: bun run build
      - name: Rewrite package.json for publish
        working-directory: clients/web
        run: |
          VERSION="${{ needs.compute-version.outputs.version }}"
          jq --arg v "$VERSION" '{name, version: $v, license, type, description, files}' package.json > tmp && mv tmp package.json
      - name: Pack tarball
        working-directory: clients/web
        run: |
          mkdir -p /tmp/npm-dist
          npm pack --pack-destination /tmp/npm-dist
          mv /tmp/npm-dist/*.tgz /tmp/npm-dist/package.tgz
          node -p "require('./package.json').name" > /tmp/npm-dist/name
          node -p "require('./package.json').version" > /tmp/npm-dist/version
      - name: Upload tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarball-dev-web
          path: /tmp/npm-dist/
          retention-days: 1

  publish-web-dev:
    name: publish-npm-dev (web)
    needs: [compute-version, build-web-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — no NPM_TOKEN
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Download tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarball-dev-web
          path: /tmp/npm-dist
      - name: Publish
        run: |
          PKG_NAME=$(cat /tmp/npm-dist/name)
          PKG_VERSION=$(cat /tmp/npm-dist/version)
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::notice::$PKG_NAME@$PKG_VERSION already published; skipping."
            exit 0
          fi
          npm publish /tmp/npm-dist/package.tgz --tag dev --access public

  publish-meta-dev:
    name: publish-npm-dev (meta)
    needs: [compute-version, publish-npm-dev, publish-web-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — no NPM_TOKEN
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Stamp dev version into meta package.json
        run: |
          VERSION="${{ needs.compute-version.outputs.version }}"
          cd meta
          jq --arg v "$VERSION" '
            .version = $v |
            .dependencies["@mycadet/assistant"] = $v |
            .dependencies["@mycadet/cli"] = $v |
            .dependencies["@mycadet/credential-executor"] = $v |
            .dependencies["@mycadet/cadet-gateway"] = $v |
            .dependencies["@mycadet/web"] = $v
          ' package.json > tmp && mv tmp package.json
      - name: Wait for dependencies to propagate
        run: ./scripts/npm-wait-for-meta-deps.sh
      - name: Generate npm-shrinkwrap.json
        run: ./scripts/npm-generate-meta-shrinkwrap.sh
      - name: Publish
        working-directory: meta
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::notice::$PKG_NAME@$PKG_VERSION already published; skipping."
            exit 0
          fi
          npm publish --tag dev --access public

  # ── iOS release (same-repo reusable workflow) ────────────────────────

  release-ios:
    needs: [parse-exclude, compute-version, push-assistant-manifest, push-gateway-manifest, push-credential-executor-manifest, build-chrome-extension]
    if: ${{ !contains(fromJSON(needs.parse-exclude.outputs.excluded), 'ios') }}
    uses: ./.github/workflows/release-ios.yaml
    with:
      environment: dev
      version: ${{ needs.compute-version.outputs.version }}
    secrets: inherit

  release-android:
    needs: [parse-exclude, compute-version, push-assistant-manifest, push-gateway-manifest, push-credential-executor-manifest, build-chrome-extension]
    if: ${{ vars.ANDROID_DEV_RELEASE_ENABLED == 'true' && !contains(fromJSON(needs.parse-exclude.outputs.excluded), 'android') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-android.yaml
    with:
      environment: dev
      version: ${{ needs.compute-version.outputs.version }}
    secrets: inherit

  build-windows:
    needs: [parse-exclude, compute-version]
    if: ${{ !contains(fromJSON(needs.parse-exclude.outputs.excluded), 'windows') }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-windows.yaml
    with:
      environment: dev
      version: ${{ needs.compute-version.outputs.version }}
    secrets: inherit

  release-windows:
    needs:
      [parse-exclude, build-windows, compute-version, push-assistant-manifest, push-gateway-manifest, push-credential-executor-manifest, build-chrome-extension]
    if: ${{ !contains(fromJSON(needs.parse-exclude.outputs.excluded), 'windows') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-windows.yaml
    with:
      environment: dev
    secrets: inherit

  # ── Slack notification (first failure only) ──────────────────────────

  notify-releases:
    name: Notify #releases on first failure
    needs: [ci-assistant-lint, ci-assistant-types, ci-assistant-tests, ci-gateway, ci-credential-executor]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Determine if any CI job failed
        id: check
        run: |
          if [[ "${{ needs.ci-assistant-lint.result }}" == "failure" || \
                "${{ needs.ci-assistant-types.result }}" == "failure" || \
                "${{ needs.ci-assistant-tests.result }}" == "failure" || \
                "${{ needs.ci-gateway.result }}" == "failure" || \
                "${{ needs.ci-credential-executor.result }}" == "failure" ]]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if previous run succeeded (first-failure detection)
        id: previous
        if: steps.check.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fetch the most recent completed run before this one
          PREV=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/dev-release.yaml/runs?per_page=5&status=completed&exclude_pull_requests=true" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})] | .[0].conclusion" \
          )
          echo "Previous run conclusion: $PREV"
          if [ "$PREV" = "success" ]; then
            echo "first_failure=true" >> "$GITHUB_OUTPUT"
          else
            echo "first_failure=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.previous.outputs.first_failure == 'true'
        with:
          sparse-checkout: .github/actions/send-build-alert
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/send-build-alert
        if: steps.previous.outputs.first_failure == 'true'
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: failure
          slack-user-id: ""
          should-tag: "false"
          channel: "#releases"
