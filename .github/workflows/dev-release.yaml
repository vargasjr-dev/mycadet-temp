  # `@mycadet/plugin-api` is generated by scripts/build-plugin-api.ts (a single
  # self-contained `index.d.ts` rollup, zod-only external), not a package dir
  # `npm pack` consumes directly, so it keeps its own combined build/publish job
  # instead of a slot in the npm publish family. Mirrors build/publish-plugin-api-* in release.yml.
  publish-plugin-api-dev:
    needs: [compute-version, ci-assistant-lint, ci-assistant-types, ci-assistant-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — no NPM_TOKEN
    environment: dev
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: |
          if ! bun install --frozen-lockfile --filter=@mycadet/assistant; then
            echo "bun install --frozen-lockfile failed; regenerating lockfile and retrying..."
            rm -f bun.lock
            bun install --filter=@mycadet/assistant
          fi
      - name: Build plugin-api package
        run: cd assistant && bun run scripts/build-plugin-api.ts --version "${{ needs.compute-version.outputs.version }}"
      - name: Pack tarball
        run: |
          cd assistant/.plugin-api-build/package
          mkdir -p /tmp/npm-dist
          npm pack --pack-destination /tmp/npm-dist
          mv /tmp/npm-dist/*.tgz /tmp/npm-dist/package.tgz
      - name: Publish
        run: |
          PKG_NAME=$(node -p "require('./assistant/.plugin-api-build/package/package.json').name")
          PKG_VERSION=$(node -p "require('./assistant/.plugin-api-build/package/package.json').version")
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::notice::$PKG_NAME@$PKG_VERSION already published; skipping."
            exit 0
          fi
          npm publish /tmp/npm-dist/package.tgz --tag dev --access public
