name: Dev Release

on:
  # The cloud drives releases by dispatching this workflow.
  workflow_dispatch: {}
  # Daily automated fire at 6:00 AM America/New_York. Cron is pinned to UTC
  # while Eastern flips between EST (UTC-5) and EDT (UTC-4), so both
  # wall-clock candidates are scheduled and the should-release gate keeps
  # whichever firing IS 6 AM in New York on that day (the loser is a green
  # no-op):
  #   - 10:00 UTC = 6:00 AM EDT (summer)
  #   - 11:00 UTC = 6:00 AM EST (winter)
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"

concurrency:
  group: dev-release
  # Queue instead of cancel: the scheduled 6 AM fire must not kill an
  # in-flight manual release mid-publish. A queued scheduled run is cheap —
  # its gate re-checks freshness and bails as a green no-op if the manual
  # run already shipped the tip.
  cancel-in-progress: false

env:
  ASSISTANT_IMAGE_NAME: mycadet-assistant-dev
  GATEWAY_IMAGE_NAME: mycadet-gateway-dev
  CREDENTIAL_EXECUTOR_IMAGE_NAME: mycadet-credential-executor-dev

jobs:
  should-release:
    # Gate for the scheduled 6 AM Eastern fire: bail as a green no-op unless
    # it is actually 6 AM in New York right now AND main has commits the
    # last successful dev release didn't already ship (a failed release
    # counts as unshipped, so the next morning retries it). Manual
    # dispatches bypass the freshness checks and always release — but the
    # JOB itself must still RUN, never skip: a skipped job poisons every
    # environment:dev job transitively downstream of it (GitHub skips those
    # even through successful intermediates — runs 53/54/55), which
    # green-no-ops the whole release. Every other job in this workflow
    # needs this one; on schedule the proceed=false path still skips them
    # via their own needs cascade.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Schedule gate (6 AM Eastern + fresh commits on main)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "RELEASE: manual dispatch always releases."
            exit 0
          fi

          NOW=$(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')
          echo "Time in New York: ${NOW}"
          HOUR=$(TZ=America/New_York date +%H)
          if [ "${HOUR}" != "06" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "SKIP: not 6:00 AM Eastern — this firing is the DST twin; skipping."
            exit 0
          fi

          REPO="${{ github.repository }}"
          TIP=$(gh api "repos/${REPO}/commits/main" --jq '.sha')
          echo "main tip: ${TIP}"

          # Only a queued release can overlap this gate (this run is the one
          # active run in the concurrency group); let it handle the tip.
          QUEUED=$(gh run list --repo "${REPO}" --workflow=dev-release.yaml \
                     --status=queued --json databaseId --jq 'length')
          if [ "${QUEUED}" != "0" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "SKIP: ${QUEUED} dev release run(s) already queued; letting them handle it."
            exit 0
          fi

          # Ship only when the last successful dev release didn't already
          # cover this tip.
          LAST=$(gh run list --repo "${REPO}" --workflow=dev-release.yaml \
                   --status=completed --limit=30 --json conclusion,headSha \
                   --jq '[.[] | select(.conclusion == "success")][0].headSha // ""')
          if [ -n "${LAST}" ] && [ "${LAST}" = "${TIP}" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "SKIP: main tip ${TIP} was already shipped by the last successful dev release — nothing new to release."
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "RELEASE: main tip ${TIP} is newer than the last successful dev release (${LAST:-none})."

  # ── Skip-if-idle gate ───────────────────────────────────────────────────
  compute-version:
    # !cancelled() is load-bearing: on manual dispatch should-release SKIPS
    # (schedule-only gate), and GitHub's default rule skips any job whose
    # need was skipped — without it the whole run cascades to a green no-op
    # (runs 53/54 on 10/17).
    needs: should-release
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.should-release.outputs.proceed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: meta/package.json
          sparse-checkout-cone-mode: false

      - name: Compute dev version
        id: version
        run: |
          BASE_VERSION=$(node -e "console.log(require('./meta/package.json').version)")
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="${BASE_VERSION}-dev.$(date -u +%Y%m%d%H%M).${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Dev release version: ${VERSION}"

  # ── CI Checks (gate image builds) ───────────────────────────────────────

  ci-assistant-lint:
    needs: should-release
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.should-release.outputs.proceed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/assistant --filter=@mycadet/gateway
        working-directory: assistant

      - name: Install bundled skill dependencies
        run: |
          for dir in skills/*/; do
            [ -f "${dir}/package.json" ] || continue
            (cd "${dir}" && bun install --frozen-lockfile 2>/dev/null || bun install)
          done

      - name: Sync feature flag registry
        run: bun run meta/sync-bundled-copies.ts

      - name: Lint
        run: bun run lint
        working-directory: assistant

  ci-assistant-types:
    needs: should-release
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.should-release.outputs.proceed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/assistant --filter=@mycadet/gateway
        working-directory: assistant

      - name: Install bundled skill dependencies
        run: |
          for dir in skills/*/; do
            [ -f "${dir}/package.json" ] || continue
            (cd "${dir}" && bun install --frozen-lockfile 2>/dev/null || bun install)
          done

      - name: Sync feature flag registry
        run: bun run meta/sync-bundled-copies.ts

      - name: Typecheck
        run: bunx tsc --noEmit
        working-directory: assistant
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  ci-assistant-tests:
    needs: should-release
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.should-release.outputs.proceed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2", "3", "4", "5", "6", "7", "8"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/assistant --filter=@mycadet/gateway
        working-directory: assistant

      - name: Install bundled skill dependencies
        run: |
          for dir in skills/*/; do
            [ -f "${dir}/package.json" ] || continue
            (cd "${dir}" && bun install --frozen-lockfile 2>/dev/null || bun install)
          done

      - name: Sync feature flag registry
        run: bun run meta/sync-bundled-copies.ts

      - name: Test (shard ${{ matrix.shard }} of 8)
        run: bun run test
        working-directory: assistant
        env:
          EXCLUDE_EXPERIMENTAL: "true"
          TEST_WORKERS: "8"
          TEST_SHARD: "${{ matrix.shard }}/8"

  ci-gateway:
    needs: should-release
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.should-release.outputs.proceed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/gateway
        working-directory: gateway

      - name: Sync feature flag registry
        run: bun run meta/sync-bundled-copies.ts

      - name: Lint
        run: bun run lint
        working-directory: gateway

      - name: Typecheck
        run: bun run typecheck
        working-directory: gateway

      - name: Test
        run: bun run test
        working-directory: gateway

  ci-credential-executor:
    needs: should-release
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.should-release.outputs.proceed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/credential-executor
        working-directory: credential-executor

      - name: Typecheck
        run: bun run typecheck
        working-directory: credential-executor

      - name: Test
        run: bun run test
        working-directory: credential-executor

  ci-cli:
    needs: should-release
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.should-release.outputs.proceed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/cli
        working-directory: cli

      - name: Lint
        run: bun run lint
        working-directory: cli

      - name: Typecheck
        run: bun run typecheck
        working-directory: cli

  ci-web-lint:
    needs: should-release
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.should-release.outputs.proceed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/web
        working-directory: clients/web

      - name: Generate API clients
        run: bun run openapi-ts
        working-directory: clients/web

      - name: Lint
        run: bun run lint
        working-directory: clients/web

  ci-web-types:
    needs: should-release
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.should-release.outputs.proceed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/web
        working-directory: clients/web

      - name: Generate API clients
        run: bun run openapi-ts
        working-directory: clients/web

      - name: Typecheck
        run: bun run typecheck
        working-directory: clients/web
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  ci-web-tests:
    needs: should-release
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.should-release.outputs.proceed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 1-based: run-isolated-tests.ts parses "i/N" with 1 <= i <= N.
        shard: ["1", "2", "3", "4"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/web
        working-directory: clients/web

      - name: Generate API clients
        run: bun run openapi-ts
        working-directory: clients/web

      - name: Test (shard ${{ matrix.shard }} of 4)
        run: bun run test:ci
        working-directory: clients/web
        env:
          TEST_SHARD: ${{ matrix.shard }}/4

  # ── Docker Images ──────────────────────────────────────────────────────

  push-assistant-image:
    needs: [compute-version, ci-assistant-lint, ci-assistant-types, ci-assistant-tests]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
        run: echo "$DOCKERHUB_ACCESS_TOKEN" | docker login -u mycadet --password-stdin
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Compute image name
        id: image
        run: |
          echo "image=docker.io/mycadet/${{ env.ASSISTANT_IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Stamp dev version into package.json
        run: jq --arg v "${{ needs.compute-version.outputs.version }}" '.version = $v' assistant/package.json > assistant/package.json.tmp && mv assistant/package.json.tmp assistant/package.json

      - name: Sync feature flag registry for Docker context
        run: cp meta/feature-flags/feature-flag-registry.json assistant/src/config/feature-flag-registry.json

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: assistant/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ steps.image.outputs.image }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=assistant-dev-${{ matrix.platform }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=assistant-dev-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Prepare platform suffix
        id: platform
        run: |
          platform="${{ matrix.platform }}"
          echo "suffix=${platform//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assistant-digests-dev-${{ steps.platform.outputs.suffix }}
          path: /tmp/digests/*
          retention-days: 1

  push-assistant-manifest:
    needs: [compute-version, push-assistant-image]
    if: ${{ always() && !cancelled() && needs.push-assistant-image.result == 'success' }}
    outputs:
      repository: ${{ steps.tags.outputs.image_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
        run: echo "$DOCKERHUB_ACCESS_TOKEN" | docker login -u mycadet --password-stdin
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: latest

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: assistant-digests-dev-*
          merge-multiple: true

      - name: Compute image tags
        id: tags
        run: |
          VERSION="${{ needs.compute-version.outputs.version }}"
          SHORT_SHA="${{ needs.compute-version.outputs.short_sha }}"
          IMAGE_REF="docker.io/mycadet/${{ env.ASSISTANT_IMAGE_NAME }}"
          IMAGE_TAGS="${IMAGE_REF}:${GITHUB_SHA}"
          IMAGE_TAGS=$(printf "%s\n%s" "$IMAGE_TAGS" "${IMAGE_REF}:${VERSION}")
          IMAGE_TAGS=$(printf "%s\n%s" "$IMAGE_TAGS" "${IMAGE_REF}:dev")
          echo "image_tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$IMAGE_TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          IMAGE="${{ steps.tags.outputs.image_name }}"
          TAG_ARGS=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAG_ARGS="$TAG_ARGS -t $tag"
          done <<< "${{ steps.tags.outputs.image_tags }}"
          SOURCES=$(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools create $TAG_ARGS $SOURCES

      - name: Export manifest digest
        id: manifest-digest
        run: |
          IMAGE="${{ steps.tags.outputs.image_name }}"
          VERSION="${{ needs.compute-version.outputs.version }}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/manifest-digest
          echo "${DIGEST}" > /tmp/manifest-digest/digest
          echo "${IMAGE}" > /tmp/manifest-digest/repository

      - name: Upload manifest digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assistant-manifest-digest-dev
          path: /tmp/manifest-digest/*
          retention-days: 1

  push-gateway-image:
    needs: [compute-version, ci-gateway]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
        run: echo "$DOCKERHUB_ACCESS_TOKEN" | docker login -u mycadet --password-stdin
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Compute image name
        id: image
        run: |
          echo "image=docker.io/mycadet/${{ env.GATEWAY_IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Stamp dev version into package.json
        run: jq --arg v "${{ needs.compute-version.outputs.version }}" '.version = $v' gateway/package.json > gateway/package.json.tmp && mv gateway/package.json.tmp gateway/package.json

      - name: Sync feature flag registry for Docker context
        run: cp meta/feature-flags/feature-flag-registry.json gateway/src/feature-flag-registry.json

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: gateway/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ steps.image.outputs.image }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=gateway-dev-${{ matrix.platform }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=gateway-dev-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Prepare platform suffix
        id: platform
        run: |
          platform="${{ matrix.platform }}"
          echo "suffix=${platform//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gateway-digests-dev-${{ steps.platform.outputs.suffix }}
          path: /tmp/digests/*
          retention-days: 1

  push-gateway-manifest:
    needs: [compute-version, push-gateway-image]
    if: ${{ always() && !cancelled() && needs.push-gateway-image.result == 'success' }}
    outputs:
      repository: ${{ steps.tags.outputs.image_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
        run: echo "$DOCKERHUB_ACCESS_TOKEN" | docker login -u mycadet --password-stdin
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: latest

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: gateway-digests-dev-*
          merge-multiple: true

      - name: Compute image tags
        id: tags
        run: |
          VERSION="${{ needs.compute-version.outputs.version }}"
          IMAGE_REF="docker.io/mycadet/${{ env.GATEWAY_IMAGE_NAME }}"
          IMAGE_TAGS="${IMAGE_REF}:${GITHUB_SHA}"
          IMAGE_TAGS=$(printf "%s\n%s" "$IMAGE_TAGS" "${IMAGE_REF}:${VERSION}")
          IMAGE_TAGS=$(printf "%s\n%s" "$IMAGE_TAGS" "${IMAGE_REF}:dev")
          echo "image_tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$IMAGE_TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          IMAGE="${{ steps.tags.outputs.image_name }}"
          TAG_ARGS=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAG_ARGS="$TAG_ARGS -t $tag"
          done <<< "${{ steps.tags.outputs.image_tags }}"
          SOURCES=$(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools create $TAG_ARGS $SOURCES

      - name: Export manifest digest
        id: manifest-digest
        run: |
          IMAGE="${{ steps.tags.outputs.image_name }}"
          VERSION="${{ needs.compute-version.outputs.version }}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/manifest-digest
          echo "${DIGEST}" > /tmp/manifest-digest/digest
          echo "${IMAGE}" > /tmp/manifest-digest/repository

      - name: Upload manifest digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gateway-manifest-digest-dev
          path: /tmp/manifest-digest/*
          retention-days: 1

  push-credential-executor-image:
    needs: [compute-version, ci-credential-executor]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
        run: echo "$DOCKERHUB_ACCESS_TOKEN" | docker login -u mycadet --password-stdin
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Compute image name
        id: image
        run: |
          echo "image=docker.io/mycadet/${{ env.CREDENTIAL_EXECUTOR_IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Stamp dev version into package.json
        run: jq --arg v "${{ needs.compute-version.outputs.version }}" '.version = $v' credential-executor/package.json > credential-executor/package.json.tmp && mv credential-executor/package.json.tmp credential-executor/package.json

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: credential-executor/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ steps.image.outputs.image }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=credential-executor-dev-${{ matrix.platform }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=credential-executor-dev-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Prepare platform suffix
        id: platform
        run: |
          platform="${{ matrix.platform }}"
          echo "suffix=${platform//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: credential-executor-digests-dev-${{ steps.platform.outputs.suffix }}
          path: /tmp/digests/*
          retention-days: 1

  push-credential-executor-manifest:
    needs: [compute-version, push-credential-executor-image]
    if: ${{ always() && !cancelled() && needs.push-credential-executor-image.result == 'success' }}
    outputs:
      repository: ${{ steps.tags.outputs.image_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
        run: echo "$DOCKERHUB_ACCESS_TOKEN" | docker login -u mycadet --password-stdin
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: latest

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: credential-executor-digests-dev-*
          merge-multiple: true

      - name: Compute image tags
        id: tags
        run: |
          VERSION="${{ needs.compute-version.outputs.version }}"
          IMAGE_REF="docker.io/mycadet/${{ env.CREDENTIAL_EXECUTOR_IMAGE_NAME }}"
          IMAGE_TAGS="${IMAGE_REF}:${GITHUB_SHA}"
          IMAGE_TAGS=$(printf "%s\n%s" "$IMAGE_TAGS" "${IMAGE_REF}:${VERSION}")
          IMAGE_TAGS=$(printf "%s\n%s" "$IMAGE_TAGS" "${IMAGE_REF}:dev")
          echo "image_tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$IMAGE_TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          IMAGE="${{ steps.tags.outputs.image_name }}"
          TAG_ARGS=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAG_ARGS="$TAG_ARGS -t $tag"
          done <<< "${{ steps.tags.outputs.image_tags }}"
          SOURCES=$(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools create $TAG_ARGS $SOURCES

      - name: Export manifest digest
        id: manifest-digest
        run: |
          IMAGE="${{ steps.tags.outputs.image_name }}"
          VERSION="${{ needs.compute-version.outputs.version }}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/manifest-digest
          echo "${DIGEST}" > /tmp/manifest-digest/digest
          echo "${IMAGE}" > /tmp/manifest-digest/repository

      - name: Upload manifest digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: credential-executor-manifest-digest-dev
          path: /tmp/manifest-digest/*
          retention-days: 1

  # ── Web SPA (dev bucket) ─────────────────────────────────────────────
  # The cloud SPA ships to the dev GCS bucket with every dev release,
  # not on merge to main; staging/production deploys live in release.yml.
  #
  # ci-web is the only hard gate: a dev release must always get the web changes
  # onto the dev instance, even when the backend half of the release does not
  # land.
  #
  # The cloud learns about dev releases by pulling from Docker Hub itself;
  # this workflow no longer registers anything with the cloud API.
  #
  # The trade-off is accepted on dev only: a dev SPA can briefly run against the
  # previously-released dev backend. Staging and production keep the strict
  # gating in release.yml, where a UI ahead of its backend actually matters.
  #
  # !cancelled() (rather than always()) keeps this quiet when a run is
  # superseded by the next release via concurrency.cancel-in-progress.
  deploy-web-spa:
    name: Deploy Web SPA (dev)
    needs: [ci-web-lint, ci-web-types, ci-web-tests]
    if: ${{ !cancelled() && needs.ci-web-lint.result == 'success' && needs.ci-web-types.result == 'success' && needs.ci-web-tests.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-cloud-web-spa.yaml
    with:
      environment: dev
    secrets: inherit

  build-chrome-extension:
    needs: [compute-version]
    if: ${{ false }} # chrome-extension offline on the dev channel; bring back online by deleting this marker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        working-directory: clients/chrome-extension
        run: bun install --frozen-lockfile

      - name: Build extension
        working-directory: clients/chrome-extension
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
          CADET_ENVIRONMENT: dev
        run: bash build.sh

      - name: Upload extension zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dev-chrome-extension
          path: clients/chrome-extension/cadet-browser-relay.zip
          retention-days: 30

  # ── Electron DMG ──────────────────────────────────────────────────────

  build-electron:
    # No publish dep: the bundled CLI floats to the `dev` dist-tag at runtime.
    needs: [compute-version]
    if: ${{ false }} # electron offline on the dev channel; bring back online by deleting this marker
    runs-on: macos-26
    timeout-minutes: 30
    # Resolves the environment-scoped STRIPE_PUBLISHABLE_KEY secret baked into
    # the renderer below.
    environment: dev
    defaults:
      run:
        working-directory: clients/macos
    env:
      KEYCHAIN_NAME: build-electron.keychain
      KEYCHAIN_PASSWORD: temporary-ci-password
      ELECTRON_TARGET_ARCH: arm64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Import code-signing certificate
        env:
          CERT_P12: ${{ secrets.DEVID_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME-db"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERT_P12" | base64 -D > /tmp/certificate.p12
          security import /tmp/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm /tmp/certificate.p12

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Verify signing identity
        run: |
          security find-identity -v -p codesigning | grep -q "Developer ID Application" \
            || { echo "::error::Developer ID Application identity not found"; exit 1; }

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          if ! bun install --frozen-lockfile --filter=@mycadet/macos --filter=@mycadet/web; then
            rm -f bun.lock && rm -rf node_modules && bun install --filter=@mycadet/macos --filter=@mycadet/web
          fi

      # Installing does not download the Electron binary or build the mac
      # helper, so packaging provisions them explicitly.
      - name: Set up Electron binary and mac helper
        run: bun run setup

      - name: Stamp dev version into package.json
        run: jq --arg v "${{ needs.compute-version.outputs.version }}" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json

      # The Communication Notifications entitlement is restricted: it may only
      # be signed into a build that embeds a provisioning profile authorizing
      # it for that build's bundle id. Without the secret the pack signs the
      # plain entitlements and posts plain notifications.
      - name: Provision the Communication Notifications profile
        env:
          MAC_PROVISIONING_PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
          # electron-builder.config.cjs derives the app id from
          # CADET_ENVIRONMENT, and the pack step below runs --environment dev.
          EXPECTED_BUNDLE_ID: ai.mycadet.electron-dev
        run: |
          if [ -z "$MAC_PROVISIONING_PROFILE" ]; then
            echo "::warning::MAC_PROVISIONING_PROFILE is unset, so the native notifier ships disabled: notifications post through Electron without the assistant avatar."
            exit 0
          fi
          PROFILE_PATH="$RUNNER_TEMP/cadet-communication.provisionprofile"
          echo "$MAC_PROVISIONING_PROFILE" | base64 -D > "$PROFILE_PATH"
          DECODED_PATH="$RUNNER_TEMP/cadet-communication-profile.plist"
          # A truncated or mis-encoded secret decodes to a file that codesign
          # accepts and macOS then rejects at launch, so prove it parses here.
          if ! security cms -D -i "$PROFILE_PATH" > "$DECODED_PATH"; then
            echo "::error::MAC_PROVISIONING_PROFILE does not decode as a provisioning profile. Re-export the .provisionprofile from the Apple Developer portal and store it base64-encoded in the secret."
            exit 1
          fi
          # Exporting the variable below makes the pack sign
          # com.apple.developer.usernotifications.communication unconditionally,
          # and macOS kills an app whose embedded profile does not authorize
          # that entitlement for its bundle id. Parsing is therefore not enough.
          GRANTED="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.usernotifications.communication" "$DECODED_PATH" 2>/dev/null || true)"
          if [ "$GRANTED" != "true" ]; then
            echo "::error::The provisioning profile does not grant com.apple.developer.usernotifications.communication. Enable Communication Notifications on the $EXPECTED_BUNDLE_ID App ID in the Apple Developer portal, regenerate the profile, and update the MAC_PROVISIONING_PROFILE secret."
            exit 1
          fi
          # A macOS profile carries the app id under
          # com.apple.application-identifier; the bare key is the iOS shape,
          # which some older exports still use.
          APPLICATION_ID="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.application-identifier" "$DECODED_PATH" 2>/dev/null || true)"
          if [ -z "$APPLICATION_ID" ]; then
            APPLICATION_ID="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$DECODED_PATH" 2>/dev/null || true)"
          fi
          if [ -z "$APPLICATION_ID" ]; then
            echo "::error::The provisioning profile carries no application-identifier entitlement, so the bundle id it authorizes cannot be read. Re-export the .provisionprofile for the $EXPECTED_BUNDLE_ID App ID and update the MAC_PROVISIONING_PROFILE secret."
            exit 1
          fi
          case "$APPLICATION_ID" in
            *".$EXPECTED_BUNDLE_ID") ;;
            *)
              echo "::error::The provisioning profile authorizes '$APPLICATION_ID', not the '$EXPECTED_BUNDLE_ID' bundle this build packages. Regenerate the profile for that App ID and update the MAC_PROVISIONING_PROFILE secret."
              exit 1
              ;;
          esac
          echo "CADET_MAC_PROVISIONING_PROFILE=$PROFILE_PATH" >> "$GITHUB_ENV"

      - name: Build and package Electron app
        env:
          CSC_NAME: Developer ID Application
          VITE_CLOUD_MODE: "false"
          VITE_WEB_MODE: "full"
          VITE_ENVIRONMENT: dev
          # Environment-scoped secret (pk_test_ on dev); requires the job's
          # `environment: dev` above, else it resolves empty and the
          # payment-method modal can't mount Stripe Elements. Publishable keys
          # are public, so embedding them is expected.
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          VITE_APP_VERSION: ${{ needs.compute-version.outputs.version }}
          # A source-map upload failure degrades to a warning instead of failing
          # the dev-release build (see clients/web/vite.config.ts).
        run: bun run pack --environment dev

      - name: Rename DMG for release
        id: dmg
        run: |
          ELECTRON_DMG=$(find dist -name "*.dmg" -type f | grep -m1 .)
          if [ -z "$ELECTRON_DMG" ]; then
            echo "::error::No DMG found in dist/"
            ls -la dist/
            exit 1
          fi
          echo "Found DMG: $ELECTRON_DMG"
          FINAL_DMG="dist/mycadet-electron-dev.dmg"
          mv "$ELECTRON_DMG" "$FINAL_DMG"
          echo "dmg_path=$FINAL_DMG" >> "$GITHUB_OUTPUT"

      - name: Sign DMG
        run: |
          codesign --sign "Developer ID Application" \
            --timestamp \
            "${{ steps.dmg.outputs.dmg_path }}"
          codesign --verify --verbose "${{ steps.dmg.outputs.dmg_path }}"

      - name: Notarize DMG
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/.private_keys
          echo "$ASC_KEY_P8" > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8

          echo "Submitting Electron DMG for notarization..."
          NOTARIZE_OUTPUT=$(xcrun notarytool submit "${{ steps.dmg.outputs.dmg_path }}" \
            --key ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait \
            --timeout 30m \
            2>&1) || NOTARIZE_FAILED=true

          echo "$NOTARIZE_OUTPUT"

          SUBMISSION_ID=$(echo "$NOTARIZE_OUTPUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | grep -m1 .)

          if [ "$NOTARIZE_FAILED" = "true" ] || echo "$NOTARIZE_OUTPUT" | grep -q "status: Invalid"; then
            echo "::error::Electron notarization failed"
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --key ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8 \
                --key-id "$ASC_KEY_ID" \
                --issuer "$ASC_ISSUER_ID" \
                || echo "::warning::Could not fetch notarization log"
            fi
            exit 1
          fi

      - name: Staple notarization ticket
        run: |
          MAX_ATTEMPTS=15
          WAIT_SECS=60
          for i in $(seq 1 $MAX_ATTEMPTS); do
            STAPLE_OUTPUT=$(xcrun stapler staple "${{ steps.dmg.outputs.dmg_path }}" 2>&1)
            STAPLE_EXIT=$?
            if [ $STAPLE_EXIT -eq 0 ]; then
              echo "Stapling succeeded on attempt $i"
              echo "$STAPLE_OUTPUT"
              break
            fi
            echo "::warning::Stapling attempt $i/$MAX_ATTEMPTS failed (exit code $STAPLE_EXIT):"
            echo "$STAPLE_OUTPUT"
            if [ "$i" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Stapling failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            echo "Waiting ${WAIT_SECS}s for CDN propagation..."
            sleep $WAIT_SECS
            WAIT_SECS=$((WAIT_SECS + 15))
          done

          xcrun stapler validate "${{ steps.dmg.outputs.dmg_path }}"

      - name: Upload Electron DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dev-electron-dmg
          path: clients/macos/dist/mycadet-electron-dev.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload Electron update artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dev-electron-update-arm64
          path: |
            clients/macos/dist/*-mac.yml
            clients/macos/dist/*.zip
            clients/macos/dist/*.zip.blockmap
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup keychain and keys
        if: always()
        run: |
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME-db"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -rf ~/.private_keys 2>/dev/null || true

  # ── Upload Electron update artifacts to GCS ────────────────────────────
  # Push per-arch update feeds (manifest + ZIP + blockmap) to the public
  # GCS bucket so electron-updater can pull delta updates. Each arch gets
  # its own path: mac-electron/dev/{arch}/.

  upload-electron-updates:
    # Gate the GCS update-feed publish (an external side effect) on the dev meta
    # publish: never offer an auto-update for a release that didn't publish.
    needs: [compute-version, build-electron, publish-meta-dev]
    if: ${{ always() && !cancelled() && needs.build-electron.result == 'success' && needs.publish-meta-dev.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download arm64 update artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dev-electron-update-arm64
          path: electron-artifacts/arm64

      - name: Validate update artifacts
        run: |
          DIR="electron-artifacts/arm64"
          if [ ! -f "$(find "$DIR" -name '*-mac.yml' -type f 2>/dev/null | grep -m1 .)" ]; then
            echo "::error::Missing update manifest (*-mac.yml) for arm64"
            exit 1
          fi
          if [ -z "$(find "$DIR" -name '*.zip' -type f ! -name '*.blockmap' 2>/dev/null | grep -m1 .)" ]; then
            echo "::error::Missing ZIP for arm64"
            exit 1
          fi

      - name: Upload Electron update artifacts to the sandbox updates store
        env:
          RCLONE_CREDENTIALS: ${{ secrets.SANDBOX_UPDATES_STORAGE_CREDENTIALS }}
          BUCKET: ${{ secrets.SANDBOX_UPDATES_BUCKET }}
        run: |
          MANIFEST_NAME="dev-mac.yml"

          for ARCH in arm64; do
            ARCH_DIR="electron-artifacts/${ARCH}"
            [ -d "$ARCH_DIR" ] || continue
            PREFIX="mac-electron/${ARCH}"

            find "$ARCH_DIR" -type f \( -name "*.zip" -o -name "*.zip.blockmap" -o -name "*-mac.yml" \) | while read -r FILE; do
              [ -z "$FILE" ] && continue
              docker run --rm \
                -v "$PWD:/work" -w /work \
                -e RCLONE_CONFIG_REMOTE_TYPE=googlecloudstorage \
                -e RCLONE_CONFIG_REMOTE_SERVICE_ACCOUNT_CREDENTIALS="$RCLONE_CREDENTIALS" \
                -e RCLONE_CONFIG_REMOTE_BUCKET_POLICY_ONLY=true \
                rclone/rclone:1.69.1 copyto "/work/$FILE" "remote:$BUCKET/$PREFIX/$(basename "$FILE")"
            done
          done

  # ── Dev npm publishing ─────────────────────────────────────────────────

  publish-npm-assistant-dev:
    needs: [compute-version, ci-assistant-lint, ci-assistant-types, ci-assistant-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — no NPM_TOKEN
    environment: dev
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
