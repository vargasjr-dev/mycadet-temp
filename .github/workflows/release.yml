  # ── Electron macOS build (arm64 + x64) ────────────────────────────────
  # Builds the Electron-wrapped macOS app for each architecture, code-signs,
  # notarizes, and uploads as release assets. A failure on either arch fails
  # this job and blocks the release.
  build-electron:
    # No publish dep: the bundled CLI floats to the `staging`/`latest` dist-tag at runtime.
    needs: [extract-version]
    runs-on: macos-26
    timeout-minutes: 30
    # Resolves the environment-scoped STRIPE_PUBLISHABLE_KEY secret baked into
    # the renderer below (same environment expression as upload-electron-updates).
    environment: ${{ needs.extract-version.outputs.is_staging == 'true' && 'staging' || 'production' }}
    strategy:
      # Let both arches finish so a failure reports which arch(es) broke; any
      # failed leg fails the job (and therefore the release).
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            dmg_name: mycadet-electron.dmg
            artifact_name: macos-build-electron
            update_artifact_name: macos-electron-update-arm64
          - arch: x64
            dmg_name: mycadet-electron-x64.dmg
            artifact_name: macos-build-electron-x64
            update_artifact_name: macos-electron-update-x64
    defaults:
      run:
        working-directory: clients/macos
    env:
      KEYCHAIN_NAME: build-electron.keychain
      KEYCHAIN_PASSWORD: temporary-ci-password
      ELECTRON_TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Import code-signing certificate
        env:
          CERT_P12: ${{ secrets.DEVID_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME-db"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERT_P12" | base64 -D > /tmp/certificate.p12
          security import /tmp/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm /tmp/certificate.p12

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Verify signing identity
        run: |
          security find-identity -v -p codesigning | grep -q "Developer ID Application" \
            || { echo "::error::Developer ID Application identity not found"; exit 1; }

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          if ! bun install --frozen-lockfile --filter=@mycadet/macos --filter=@mycadet/web; then
            rm -f bun.lock && rm -rf node_modules && bun install --filter=@mycadet/macos --filter=@mycadet/web
          fi

      # Installing does not download the Electron binary or build the mac
      # helper, so packaging provisions them explicitly.
      - name: Set up Electron binary and mac helper
        run: bun run setup

      - name: Stamp release version into package.json
        run: jq --arg v "${{ needs.extract-version.outputs.version }}" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json

      # The Communication Notifications entitlement is restricted: it may only
      # be signed into a build that embeds a provisioning profile authorizing
      # it for that build's bundle id. Without the secret the pack signs the
      # plain entitlements and posts plain notifications.
      - name: Provision the Communication Notifications profile
        env:
          MAC_PROVISIONING_PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
          # electron-builder.config.cjs derives the app id from
          # CADET_ENVIRONMENT, which the pack step below sets from the same
          # staging/production switch.
          EXPECTED_BUNDLE_ID: ${{ needs.extract-version.outputs.is_staging == 'true' && 'ai.mycadet.electron-staging' || 'ai.mycadet.electron' }}
        run: |
          if [ -z "$MAC_PROVISIONING_PROFILE" ]; then
            echo "::warning::MAC_PROVISIONING_PROFILE is unset, so the native notifier ships disabled: notifications post through Electron without the assistant avatar."
            exit 0
          fi
          PROFILE_PATH="$RUNNER_TEMP/cadet-communication.provisionprofile"
          echo "$MAC_PROVISIONING_PROFILE" | base64 -D > "$PROFILE_PATH"
          DECODED_PATH="$RUNNER_TEMP/cadet-communication-profile.plist"
          # A truncated or mis-encoded secret decodes to a file that codesign
          # accepts and macOS then rejects at launch, so prove it parses here.
          if ! security cms -D -i "$PROFILE_PATH" > "$DECODED_PATH"; then
            echo "::error::MAC_PROVISIONING_PROFILE does not decode as a provisioning profile. Re-export the .provisionprofile from the Apple Developer portal and store it base64-encoded in the secret."
            exit 1
          fi
          # Exporting the variable below makes the pack sign
          # com.apple.developer.usernotifications.communication unconditionally,
          # and macOS kills an app whose embedded profile does not authorize
          # that entitlement for its bundle id. Parsing is therefore not enough.
          GRANTED="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.usernotifications.communication" "$DECODED_PATH" 2>/dev/null || true)"
          if [ "$GRANTED" != "true" ]; then
            echo "::error::The provisioning profile does not grant com.apple.developer.usernotifications.communication. Enable Communication Notifications on the $EXPECTED_BUNDLE_ID App ID in the Apple Developer portal, regenerate the profile, and update the MAC_PROVISIONING_PROFILE secret."
            exit 1
          fi
          # A macOS profile carries the app id under
          # com.apple.application-identifier; the bare key is the iOS shape,
          # which some older exports still use.
          APPLICATION_ID="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.application-identifier" "$DECODED_PATH" 2>/dev/null || true)"
          if [ -z "$APPLICATION_ID" ]; then
            APPLICATION_ID="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$DECODED_PATH" 2>/dev/null || true)"
          fi
          if [ -z "$APPLICATION_ID" ]; then
            echo "::error::The provisioning profile carries no application-identifier entitlement, so the bundle id it authorizes cannot be read. Re-export the .provisionprofile for the $EXPECTED_BUNDLE_ID App ID and update the MAC_PROVISIONING_PROFILE secret."
            exit 1
          fi
          case "$APPLICATION_ID" in
            *".$EXPECTED_BUNDLE_ID") ;;
            *)
              echo "::error::The provisioning profile authorizes '$APPLICATION_ID', not the '$EXPECTED_BUNDLE_ID' bundle this build packages. Regenerate the profile for that App ID and update the MAC_PROVISIONING_PROFILE secret."
              exit 1
              ;;
          esac
          echo "CADET_MAC_PROVISIONING_PROFILE=$PROFILE_PATH" >> "$GITHUB_ENV"

      - name: Build and package Electron app
        env:
          CSC_NAME: Developer ID Application
          VITE_PLATFORM_MODE: "false"
          VITE_ENVIRONMENT: ${{ needs.extract-version.outputs.is_staging == 'true' && 'staging' || 'production' }}
          VITE_SESSION_REPLAY_APP_ID: ${{ vars.VITE_SESSION_REPLAY_APP_ID }}
          # Environment-scoped secret (pk_test_ on staging, pk_live_ on prod);
          # requires the job's `environment:` above, else it resolves empty and
          # the payment-method modal can't mount Stripe Elements. Publishable
          # keys are public, so embedding them is expected.
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          # VITE_APP_VERSION stamps the semver release version into the bundle.
          VITE_APP_VERSION: ${{ needs.extract-version.outputs.version }}
        run: bun run pack --environment "${{ needs.extract-version.outputs.is_staging == 'true' && 'staging' || 'production' }}"

      - name: Rename DMG for release
        id: dmg
        run: |
          ELECTRON_DMG=$(find dist -name "*.dmg" -type f | grep -m1 .)
          if [ -z "$ELECTRON_DMG" ]; then
            echo "::error::No DMG found in dist/"
            ls -la dist/
            exit 1
          fi
          echo "Found DMG: $ELECTRON_DMG"
          FINAL_DMG="dist/${{ matrix.dmg_name }}"
          mv "$ELECTRON_DMG" "$FINAL_DMG"
          echo "dmg_path=$FINAL_DMG" >> "$GITHUB_OUTPUT"

      - name: Sign DMG
        run: |
          codesign --sign "Developer ID Application" \
            --timestamp \
            "${{ steps.dmg.outputs.dmg_path }}"
          codesign --verify --verbose "${{ steps.dmg.outputs.dmg_path }}"
          echo "Electron DMG signature verified"

      - name: Notarize DMG
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/.private_keys
          echo "$ASC_KEY_P8" > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8

          echo "Submitting Electron DMG for notarization..."
          NOTARIZE_OUTPUT=$(xcrun notarytool submit "${{ steps.dmg.outputs.dmg_path }}" \
            --key ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait \
            --timeout 30m \
            2>&1) || NOTARIZE_FAILED=true

          echo "$NOTARIZE_OUTPUT"

          SUBMISSION_ID=$(echo "$NOTARIZE_OUTPUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | grep -m1 .)

          if [ "$NOTARIZE_FAILED" = "true" ] || echo "$NOTARIZE_OUTPUT" | grep -q "status: Invalid"; then
            echo "::error::Electron notarization failed"
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --key ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8 \
                --key-id "$ASC_KEY_ID" \
                --issuer "$ASC_ISSUER_ID" \
                || echo "::warning::Could not fetch notarization log"
            fi
            exit 1
          fi

          echo "Electron notarization succeeded"

      - name: Staple notarization ticket
        run: |
          MAX_ATTEMPTS=15
          WAIT_SECS=60
          for i in $(seq 1 $MAX_ATTEMPTS); do
            STAPLE_OUTPUT=$(xcrun stapler staple "${{ steps.dmg.outputs.dmg_path }}" 2>&1)
            STAPLE_EXIT=$?
            if [ $STAPLE_EXIT -eq 0 ]; then
              echo "Stapling succeeded on attempt $i"
              echo "$STAPLE_OUTPUT"
              break
            fi
            echo "::warning::Stapling attempt $i/$MAX_ATTEMPTS failed (exit code $STAPLE_EXIT):"
            echo "$STAPLE_OUTPUT"
            if [ "$i" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Stapling failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            echo "Waiting ${WAIT_SECS}s for CDN propagation..."
            sleep $WAIT_SECS
            WAIT_SECS=$((WAIT_SECS + 15))
          done

          xcrun stapler validate "${{ steps.dmg.outputs.dmg_path }}"
          echo "Electron notarization ticket stapled and validated"

      # Update artifacts upload before the DMG so a DMG artifact never exists
      # without its update feed (a DMG shipped without one strands auto-update).
      - name: Upload Electron update artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.update_artifact_name }}
          path: |
            clients/macos/dist/*-mac.yml
            clients/macos/dist/*.zip
            clients/macos/dist/*.zip.blockmap
          if-no-files-found: error
          retention-days: 7

      - name: Upload Electron DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: clients/macos/dist/${{ matrix.dmg_name }}
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup keychain and keys
        if: always()
        run: |
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME-db"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -rf ~/.private_keys 2>/dev/null || true


  upload-electron-updates:
    needs:
      [extract-version, build-electron, publish-meta-prod, publish-meta-staging]
    # always() disables the implicit success(): publish-meta-prod/-staging is
    # skipped on the other channel.
    if: ${{ always() && !cancelled() && needs.build-electron.result == 'success' && (needs.publish-meta-prod.result == 'success' || needs.publish-meta-staging.result == 'success') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ needs.extract-version.outputs.is_staging == 'true' && 'staging' || 'production' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download arm64 update artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-electron-update-arm64
          path: electron-artifacts/arm64

      - name: Download x64 update artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-electron-update-x64
          path: electron-artifacts/x64

      - name: Validate update artifacts
        run: |
          DIR="electron-artifacts/arm64"
          if [ ! -f "$(find "$DIR" -name '*-mac.yml' -type f 2>/dev/null | grep -m1 .)" ]; then
            echo "::error::Missing update manifest (*-mac.yml) for arm64"
            exit 1
          fi
          if [ -z "$(find "$DIR" -name '*.zip' -type f ! -name '*.blockmap' 2>/dev/null | grep -m1 .)" ]; then
            echo "::error::Missing ZIP for arm64"
            exit 1
          fi

      - name: Upload Electron update artifacts to the sandbox updates store
        env:
          RCLONE_CREDENTIALS: ${{ secrets.SANDBOX_UPDATES_STORAGE_CREDENTIALS }}
          BUCKET: ${{ secrets.SANDBOX_UPDATES_BUCKET }}
        run: |
          ENVIRONMENT=${{ needs.extract-version.outputs.is_staging == 'true' && 'staging' || 'production' }}
          MANIFEST_NAME="${ENVIRONMENT}-mac.yml"

          for ARCH in arm64 x64; do
            ARCH_DIR="electron-artifacts/${ARCH}"
            [ -d "$ARCH_DIR" ] || continue
            PREFIX="mac-electron/${ENVIRONMENT}/${ARCH}"

            find "$ARCH_DIR" -type f \( -name "*.zip" -o -name "*.zip.blockmap" -o -name "*-mac.yml" \) | while read -r FILE; do
              [ -z "$FILE" ] && continue
              docker run --rm \
                -v "$PWD:/work" -w /work \
                -e RCLONE_CONFIG_REMOTE_TYPE=googlecloudstorage \
                -e RCLONE_CONFIG_REMOTE_SERVICE_ACCOUNT_CREDENTIALS="$RCLONE_CREDENTIALS" \
                -e RCLONE_CONFIG_REMOTE_BUCKET_POLICY_ONLY=true \
                rclone/rclone:1.69.1 copyto "/work/$FILE" "remote:$BUCKET/$PREFIX/$(basename "$FILE")"
            done
          done

  release:
    needs:
      [
        extract-version,
        publish-npm-prod,
        publish-web-prod,
        publish-meta-prod,
        publish-plugin-api-prod,
        build-electron,
        push-assistant-manifest,
        push-gateway-manifest,
        push-credential-executor-manifest,
        build-chrome-extension,
      ]
    if: ${{ always() && !cancelled() && needs.extract-version.outputs.is_staging != 'true' && needs.extract-version.result == 'success' && needs.publish-npm-prod.result == 'success' && needs.publish-web-prod.result == 'success' && needs.publish-meta-prod.result == 'success' && needs.publish-plugin-api-prod.result == 'success' && needs.push-assistant-manifest.result == 'success' && needs.push-gateway-manifest.result == 'success' && needs.push-credential-executor-manifest.result == 'success' && needs.build-electron.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # tag + GitHub Release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Tag release
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          git tag "v$VERSION" 2>/dev/null || true
          git push origin "v$VERSION" 2>/dev/null || echo "Tag v$VERSION already exists on remote"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Generate release notes from commits
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd scripts && bun install && cd ..
          bun scripts/generate-release-notes.ts \
            --version "${{ needs.extract-version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --output /tmp/release-notes.md

      - name: Download Chrome extension zip
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: chrome-extension-zip
          path: chrome-extension-artifacts

      - name: Download Chrome extension CRX (zipped)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: chrome-extension-crx-zip
          path: chrome-extension-artifacts

      # Electron is a hard release dependency: the `release` job only runs when
      - name: Download Electron DMG artifact (arm64)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-build-electron
          path: electron-artifacts

      - name: Download Electron DMG artifact (x64)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-build-electron-x64
          path: electron-artifacts-x64

      - name: Create GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          VERSION_TAG="v${VERSION}"
          NOTES_FILE="/tmp/release-notes.md"

          ASSETS=()

          # The Electron DMGs are required. A missing DMG here fails the
          # release rather than publishing without it.
          # The arm64 build is published under the canonical mycadet.dmg
          # name — the production desktop download URL and scripts/production-release.sh
          # both resolve the release asset by that exact name.
          ELECTRON_DMG=$(find electron-artifacts -name "mycadet-electron.dmg" -type f | grep -m1 .)
          if [ -z "$ELECTRON_DMG" ]; then
            echo "::error::Electron arm64 DMG missing"
            exit 1
          fi
          ASSETS+=("$ELECTRON_DMG#mycadet.dmg")
          ELECTRON_X64_DMG=$(find electron-artifacts-x64 -name "mycadet-electron-x64.dmg" -type f | grep -m1 .)
          if [ -z "$ELECTRON_X64_DMG" ]; then
            echo "::error::Electron x64 DMG missing"
            exit 1
          fi
          ASSETS+=("$ELECTRON_X64_DMG#mycadet-electron-x64.dmg")

          INSTALL_SH="cli/src/adapters/install.sh"
          [ -f "$INSTALL_SH" ] && ASSETS+=("$INSTALL_SH#install.sh")

          # Add Chrome extension artifacts if available
          if [ -d "chrome-extension-artifacts" ]; then
            CRX_ZIP=$(find chrome-extension-artifacts -name "cadet-browser-relay.zip" -type f | head -1)
            [ -n "$CRX_ZIP" ] && ASSETS+=("$CRX_ZIP#cadet-browser-relay-${VERSION}.zip")
            CRX_FILE_ZIP=$(find chrome-extension-artifacts -name "cadet-browser-relay.crx.zip" -type f | head -1)
            [ -n "$CRX_FILE_ZIP" ] && ASSETS+=("$CRX_FILE_ZIP#cadet-browser-relay-${VERSION}.crx.zip")
          fi

          echo "Release assets: ${ASSETS[*]}"

          # Create release on mycadet (this repo)
          if ! gh release view "$VERSION_TAG" --repo "${{ github.repository }}" &>/dev/null; then
            gh release create "$VERSION_TAG" \
              "${ASSETS[@]}" \
              --repo "${{ github.repository }}" \
              --title "Cadet $VERSION" \
              --notes-file "$NOTES_FILE" \
              --latest
            echo "Release created at https://github.com/${{ github.repository }}/releases/tag/$VERSION_TAG"
          else
            echo "Release $VERSION_TAG already exists on ${{ github.repository }}, skipping"
          fi

          rm -f "$NOTES_FILE"

  merge-release-branch:
    needs: [extract-version, release]
    if: ${{ !cancelled() && needs.extract-version.outputs.is_staging != 'true' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      outcome: ${{ steps.merge.outcome }}
    permissions:
      contents: write # merge the release branch back to main
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Merge release branch and delete
        id: merge
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          BRANCH="release/v$VERSION"

          PR_URL=$(gh pr create \
            --title "Release v$VERSION" \
            --body "Automated version bump to $VERSION." \
            --base main \
            --head "$BRANCH")

          # Try the normal merge first. If it fails (e.g. due to cherry-picked
          # commits causing conflicts), rebase onto main with `-X ours` to
          # auto-resolve textual conflicts in favor of main and retry. During a
          # rebase, ours is the new base, so `-X ours` keeps main's side.
          if ! gh pr merge "$PR_URL" --squash --admin --delete-branch; then
            echo "Merge failed - rebasing with -X ours to keep main on conflicts"

            git config user.name "cadet-automation[bot]"
            git config user.email "192048195+cadet-automation[bot]@users.noreply.github.com"

            git fetch origin main
            git rebase -X ours origin/main

            # Append [skip ci] so the force-push doesn't re-trigger this workflow
            git commit --allow-empty --amend -m "$(git log -1 --format=%B) [skip ci]"
            git push --no-verify origin "$BRANCH" --force-with-lease

            # Give GitHub time to process the force-push before retrying
            sleep 10
            gh pr merge "$PR_URL" --squash --admin --delete-branch
          fi

  update-platform:
    needs: [extract-version, publish-npm-prod]
    if: ${{ false }} # offline until the cadet automation app exists; bring back online by deleting this marker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.CADET_AUTOMATION_GITHUB_APP_ID }}
          private-key: ${{ secrets.CADET_AUTOMATION_GITHUB_PRIVATE_KEY }}
          repositories: mycadet-platform

      - name: Checkout platform repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: vargasjr-dev/mycadet-platform
          token: ${{ steps.app-token.outputs.token }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Update vel dependency
        env:
          NEW_VERSION: ${{ needs.extract-version.outputs.version }}
        run: |
          cd vel
          jq --arg v "$NEW_VERSION" '.dependencies["@mycadet/cli"] = $v' package.json > package.json.tmp && mv package.json.tmp package.json
          bun install

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_VERSION: ${{ needs.extract-version.outputs.version }}
        run: |
          BRANCH="auto/bump-cli-${NEW_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add vel/package.json vel/bun.lock
          git commit -m "Bump @mycadet/cli to ${NEW_VERSION} in vel"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --repo vargasjr-dev/mycadet-platform \
            --title "Bump @mycadet/cli to ${NEW_VERSION} in vel" \
            --body "Auto-generated PR to update @mycadet/cli to ${NEW_VERSION}." \
            --base main \
            --head "$BRANCH")
          sleep 10
          gh pr merge "$PR_URL" --auto --squash

