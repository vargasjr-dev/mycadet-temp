        working-directory: assistant

  ci-assistant-types:
    needs: extract-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/assistant --filter=@mycadet/gateway
        working-directory: assistant

      - name: Install bundled skill dependencies
        run: |
          for dir in skills/*/; do
            [ -f "${dir}/package.json" ] || continue
            (cd "${dir}" && bun install --frozen-lockfile 2>/dev/null || bun install)
          done

      - name: Sync feature flag registry
        run: bun run meta/sync-bundled-copies.ts

      - name: Typecheck
        run: bunx tsc --noEmit
        working-directory: assistant
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  ci-assistant-tests:
    needs: extract-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2", "3", "4"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/assistant --filter=@mycadet/gateway
        working-directory: assistant

      - name: Install bundled skill dependencies
        run: |
          for dir in skills/*/; do
            [ -f "${dir}/package.json" ] || continue
            (cd "${dir}" && bun install --frozen-lockfile 2>/dev/null || bun install)
          done

      - name: Sync feature flag registry
        run: bun run meta/sync-bundled-copies.ts

      - name: Test (shard ${{ matrix.shard }} of 4)
        run: bun run test
        working-directory: assistant
        env:
          EXCLUDE_EXPERIMENTAL: "true"
          TEST_WORKERS: "8"
          TEST_SHARD: "${{ matrix.shard }}/4"

  ci-gateway:
    needs: extract-version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/gateway
        working-directory: gateway

      - name: Sync feature flag registry
        run: bun run meta/sync-bundled-copies.ts

      - name: Lint
        run: bun run lint
        working-directory: gateway

      - name: Typecheck
        run: bun run typecheck
        working-directory: gateway

      - name: Test
        run: bun run test
        working-directory: gateway

  ci-credential-executor:
    needs: extract-version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/credential-executor
        working-directory: credential-executor

      - name: Typecheck
        run: bun run typecheck
        working-directory: credential-executor

      - name: Test
        run: bun run test
        working-directory: credential-executor

  ci-cli:
    needs: extract-version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/cli
        working-directory: cli

      - name: Lint
        run: bun run lint
        working-directory: cli

      - name: Typecheck
        run: bun run typecheck
        working-directory: cli

  ci-web-lint:
    needs: extract-version
    needs: [compute-version]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/web
        working-directory: clients/web

      - name: Generate API clients
        run: bun run openapi-ts
        working-directory: clients/web

      - name: Lint
        run: bun run lint
        working-directory: clients/web

  ci-web-types:
    needs: extract-version
    needs: [compute-version]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/web
        working-directory: clients/web

      - name: Generate API clients
        run: bun run openapi-ts
        working-directory: clients/web

      - name: Typecheck
        run: bun run typecheck
        working-directory: clients/web
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  ci-web-tests:
    needs: extract-version
    needs: [compute-version]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2", "3", "4"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/web
        working-directory: clients/web

      - name: Generate API clients
        run: bun run openapi-ts
        working-directory: clients/web

      - name: Test (shard ${{ matrix.shard }} of 4)
        run: bun run test:ci
        working-directory: clients/web
        env:
          TEST_SHARD: ${{ matrix.shard }}/4

  notify-release:
    name: Slack Notification (Release)
    if: ${{ always() && !cancelled() }}
    needs:
      [
        extract-version,
        publish-npm-prod,
        publish-web-prod,
        publish-meta-prod,
        publish-plugin-api-prod,
        publish-npm-staging,
        publish-web-staging,
        publish-meta-staging,
        publish-plugin-api-staging,
        build-electron,
        push-assistant-manifest,
        push-gateway-manifest,
        push-credential-executor-manifest,
        tag-staging-release,
        release,
        merge-release-branch,
        update-platform,
        pack-cli,
        trigger-platform-qa,
        release-ios,
        release-android,
        build-windows,
        release-windows,
        ci-assistant-lint,
        ci-assistant-types,
        ci-assistant-tests,
        ci-cli,
        ci-credential-executor,
        ci-gateway,
        ci-web-lint,
        ci-web-types,
        ci-web-tests,
        build-chrome-extension,
        publish-chrome-extension,
        deploy-web-spa-staging,
        deploy-web-spa-production,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Build Slack payload
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_USER_ID: ${{ inputs.slack_user_id }}
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          VERSION_TAG="v${VERSION}"
          IS_STAGING="${{ needs.extract-version.outputs.is_staging }}"

          # Determine release status. The production SPA deploy runs AFTER
          # the release job (registration-first ordering), so its failure
          # must mark the release failed here — release.result no longer
          # covers it.
          # npm publishes are gated here too: a version desync makes an
          # individual publish job fail (or skip) while release.result can still
          # be success, so keying only off release/deploy-web-spa would report a
          # green release even though nothing reached npm.
          WINDOWS_RESULT="${{ needs.release-windows.result }}"
          if [ "${{ needs.build-windows.result }}" = "failure" ] \
            || [ "${{ needs.build-windows.result }}" = "cancelled" ]; then
            WINDOWS_RESULT="${{ needs.build-windows.result }}"
          fi
          RELEASE_FAILED="false"
          if [ "$IS_STAGING" != "true" ] && {
            [ "${{ needs.release.result }}" != "success" ] \
            || [ "${{ needs.deploy-web-spa-production.result }}" != "success" ] \
            || [ "${{ needs.publish-npm-prod.result }}" != "success" ] \
            || [ "${{ needs.publish-web-prod.result }}" != "success" ] \
            || [ "${{ needs.publish-meta-prod.result }}" != "success" ] \
            || [ "${{ needs.publish-plugin-api-prod.result }}" != "success" ] \
            || { [ "${{ needs.release-android.result }}" != "success" ] \
              && [ "${{ needs.release-android.result }}" != "skipped" ]; } \
            || { [ "$WINDOWS_RESULT" != "success" ] \
              && [ "$WINDOWS_RESULT" != "skipped" ]; }; }; then
            RELEASE_FAILED="true"
          fi

          # For staging releases, check that desktop app and Docker images were successfully pushed
          STAGING_READY="true"
          if [ "$IS_STAGING" = "true" ]; then
            if [ "${{ needs.build-electron.result }}" != "success" ]; then
              STAGING_READY="false"
            fi
            if [ "${{ needs.push-assistant-manifest.result }}" != "success" ]; then
              STAGING_READY="false"
            fi
            if [ "${{ needs.push-gateway-manifest.result }}" != "success" ]; then
              STAGING_READY="false"
            fi
            if [ "${{ needs.push-credential-executor-manifest.result }}" != "success" ]; then
              STAGING_READY="false"
            fi
            if [ "${{ needs.tag-staging-release.result }}" != "success" ]; then
              STAGING_READY="false"
            fi
            if [ "${{ needs.deploy-web-spa-staging.result }}" != "success" ]; then
              STAGING_READY="false"
            fi
            # Staging npm publishes must land too — a version desync here fails
            # the publish job while the rest of the release stays green.
            if [ "${{ needs.publish-npm-staging.result }}" != "success" ]; then
              STAGING_READY="false"
            fi
            if [ "${{ needs.publish-web-staging.result }}" != "success" ]; then
              STAGING_READY="false"
            fi
            if [ "${{ needs.publish-meta-staging.result }}" != "success" ]; then
              STAGING_READY="false"
            fi
            if [ "${{ needs.publish-plugin-api-staging.result }}" != "success" ]; then
              STAGING_READY="false"
            fi
            if [ "${{ needs.release-android.result }}" != "success" ] \
              && [ "${{ needs.release-android.result }}" != "skipped" ]; then
              STAGING_READY="false"
            fi
            if [ "$WINDOWS_RESULT" != "success" ] \
              && [ "$WINDOWS_RESULT" != "skipped" ]; then
              STAGING_READY="false"
            fi
          fi

          if [ "$IS_STAGING" = "true" ]; then
            if [ "$STAGING_READY" != "true" ]; then
              HEADER="❌ Staging Release ${VERSION_TAG} Failed"
              STYLE="danger"
            else
              HEADER="🟡 Staging Release ${VERSION_TAG} Ready"
              STYLE=""
            fi
          elif [ "$RELEASE_FAILED" = "true" ]; then
            HEADER="❌ Release ${VERSION_TAG} Failed"
            STYLE="danger"
          else
            HEADER="✅ Release ${VERSION_TAG} Succeeded"
            STYLE=""
          fi

          # Build CI status icons
          ci_icon() { if [ "$1" = "success" ]; then printf '✅'; elif [ "$1" = "skipped" ]; then printf '⏭️'; else printf '❌'; fi; }

          worst() {
            if [ "$2" = "failure" ] || [ "$3" = "failure" ] || [ "$4" = "failure" ]; then echo failure
            elif [ "$2" = "cancelled" ] || [ "$3" = "cancelled" ] || [ "$4" = "cancelled" ]; then echo cancelled
            elif [ "$2" = "skipped" ] && [ "$3" = "skipped" ] && [ "$4" = "skipped" ]; then echo skipped
            else echo success; fi
          }
          A=$(ci_icon "$(worst x "${{ needs.ci-assistant-lint.result }}" "${{ needs.ci-assistant-types.result }}" "${{ needs.ci-assistant-tests.result }}")")
          W=$(ci_icon "$(worst x "${{ needs.ci-web-lint.result }}" "${{ needs.ci-web-types.result }}" "${{ needs.ci-web-tests.result }}")")
          C=$(ci_icon "${{ needs.ci-cli.result }}")
          CE=$(ci_icon "${{ needs.ci-credential-executor.result }}")
          G=$(ci_icon "${{ needs.ci-gateway.result }}")
          DE=$(ci_icon "${{ needs.build-electron.result }}")
          AI=$(ci_icon "${{ needs.push-assistant-manifest.result }}")
          GI=$(ci_icon "${{ needs.push-gateway-manifest.result }}")
          CEI=$(ci_icon "${{ needs.push-credential-executor-manifest.result }}")
          TR=$(ci_icon "${{ needs.tag-staging-release.result }}")
          PC=$(ci_icon "${{ needs.pack-cli.result }}")
          TQ=$(ci_icon "${{ needs.trigger-platform-qa.result }}")
          DI=$(ci_icon "${{ needs.release-ios.result }}")
          DA=$(ci_icon "${{ needs.release-android.result }}")
          DW=$(ci_icon "$WINDOWS_RESULT")
          CX=$(ci_icon "${{ needs.build-chrome-extension.result }}")
          CXP=$(ci_icon "${{ needs.publish-chrome-extension.result }}")
          MERGE_OUTCOME="${{ needs.merge-release-branch.outputs.outcome || needs.merge-release-branch.result }}"
          MB=$(ci_icon "$MERGE_OUTCOME")

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          CI_LINE=$(printf '*CI Checks:*\n• %s assistant\n• %s cli\n• %s credential-executor\n• %s gateway\n• %s web\n• %s desktop-electron\n• %s release-ios\n• %s release-android\n• %s release-windows\n• %s chrome-extension\n• %s cws-publish\n• %s assistant-docker\n• %s gateway-docker\n• %s credential-executor-docker\n• %s tag-staging-release\n• %s pack-cli\n• %s trigger-platform-qa\n• %s merge-release-branch' "$A" "$C" "$CE" "$G" "$W" "$DE" "$DI" "$DA" "$DW" "$CX" "$CXP" "$AI" "$GI" "$CEI" "$TR" "$PC" "$TQ" "$MB")

          if [ -n "$SLACK_USER_ID" ]; then
            TRIGGERED_BY="<@${SLACK_USER_ID}>"
          else
            TRIGGERED_BY="${{ github.actor }}"
          fi

          if [ "$IS_STAGING" = "true" ]; then
            META_LINE=$(printf '*Version:* `%s`\n*Triggered by:* %s\n\n_This is a staging release. npm packages published to the staging dist-tag, Docker images pushed to Docker Hub, and the staging release was tagged._' "$VERSION" "$TRIGGERED_BY")
          else
            META_LINE=$(printf '*Version:* `%s`\n*Triggered by:* %s' "$VERSION" "$TRIGGERED_BY")
          fi

          # Fetch release notes from GitHub release (only for production releases)
          RELEASE_BODY=""
          if [ "$IS_STAGING" != "true" ]; then
            RELEASE_BODY=$(gh release view "$VERSION_TAG" --repo "${{ github.repository }}" --json body -q .body 2>/dev/null || echo "")
          fi

          RELEASE_SUMMARY=""
          if [ -n "$RELEASE_BODY" ]; then
            # Extract highlights bullets for the Slack summary
            HIGHLIGHTS=$(echo "$RELEASE_BODY" | awk '/^## Highlights/{f=1; next} /^(## |---$)/{f=0} f' | grep '^- ' || true)

            if [ -n "$HIGHLIGHTS" ]; then
              # Use highlights as the release summary, converted to Slack mrkdwn
              RELEASE_SUMMARY=$(echo "$HIGHLIGHTS" | \
                sed 's/\*\*\([^*]*\)\*\*/*\1*/g' | \
                sed 's/\[\([^]]*\)\](\([^)]*\))/<\2|\1>/g')
            fi
          fi

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${VERSION_TAG}"

          # Build JSON payload with jq
          BLOCKS="[]"

          # Header
          BLOCKS=$(echo "$BLOCKS" | jq --arg header "$HEADER" '. + [{ type: "header", text: { type: "plain_text", text: $header } }]')

          # Release summary (if available)
          if [ -n "$RELEASE_SUMMARY" ]; then
            BLOCKS=$(echo "$BLOCKS" | jq --arg summary "$RELEASE_SUMMARY" '. + [{ type: "section", text: { type: "mrkdwn", text: $summary } }]')
          fi

          # CI checks + metadata
          BODY=$(printf '%s\n\n%s' "$CI_LINE" "$META_LINE")
          BLOCKS=$(echo "$BLOCKS" | jq --arg body "$BODY" '. + [{ type: "section", text: { type: "mrkdwn", text: $body } }]')

          # Warning if merge-release-branch failed
          if [ "$MERGE_OUTCOME" != "success" ] && [ "$MERGE_OUTCOME" != "skipped" ] && [ "$IS_STAGING" != "true" ] && [ "$RELEASE_FAILED" != "true" ]; then
            MERGE_WARNING="⚠️ *The release branch failed to merge to main and must be merged manually.* Run \`gh pr create --base main --head release/v${VERSION}\` and merge."
            BLOCKS=$(echo "$BLOCKS" | jq --arg warning "$MERGE_WARNING" '. + [{ type: "section", text: { type: "mrkdwn", text: $warning } }]')
          fi

          # Buttons
          VIEW_RUN=$(jq -n --arg url "$RUN_URL" --arg style "$STYLE" '{
            type: "button",
            text: { type: "plain_text", text: "View Run" },
            url: $url
          } + (if $style != "" then { style: $style } else {} end)')

          VIEW_RELEASE=$(jq -n --arg url "$RELEASE_URL" '{
            type: "button",
            text: { type: "plain_text", text: "View Release" },
            url: $url,
            style: "primary"
          }')

          if [ "$RELEASE_FAILED" = "true" ] || [ "$IS_STAGING" = "true" ]; then
            BUTTONS=$(jq -n --argjson run "$VIEW_RUN" '[$run]')
          else
            BUTTONS=$(jq -n --argjson run "$VIEW_RUN" --argjson release "$VIEW_RELEASE" '[$run, $release]')
          fi

          BLOCKS=$(echo "$BLOCKS" | jq --argjson buttons "$BUTTONS" '. + [{ type: "actions", elements: $buttons }]')

          jq -n --argjson blocks "$BLOCKS" '{
            unfurl_links: false,
            unfurl_media: false,
            blocks: $blocks
          }' > /tmp/slack-payload.json

      - name: Notify Slack
        id: slack
        continue-on-error: true
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          webhook: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: /tmp/slack-payload.json
          errors: true

      - name: Log Slack notification result
        if: always()
        run: |
          echo "Slack step outcome: ${{ steps.slack.outcome }}"
          echo "Slack response ok: ${{ steps.slack.outputs.ok }}"
          echo "Slack response time: ${{ steps.slack.outputs.time }}"
          if [ "${{ steps.slack.outcome }}" != "success" ]; then
            echo "::warning::Slack notification failed to send. Check webhook URL and channel configuration."
          fi
