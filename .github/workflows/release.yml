name: Release

on:
  push:
    branches:
      - "release/v*"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  ASSISTANT_IMAGE_NAME: mycadet-assistant
  GATEWAY_IMAGE_NAME: mycadet-gateway
  CREDENTIAL_EXECUTOR_IMAGE_NAME: mycadet-credential-executor

jobs:
  extract-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.finalize.outputs.version }}
      base_version: ${{ steps.extract.outputs.base_version }}
      chrome_extension_changed: ${{ steps.detect-extension-changes.outputs.changed }}
    permissions:
      contents: read
      actions: write # cancel-run API (Cancel run if release already published)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Extract version from branch name
        id: extract
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [[ "$BRANCH" == release/v* ]]; then
            BASE_VERSION="${BRANCH#release/v}"
            # Only allow clean semver branches (e.g. release/v0.6.0), reject
            # branches with suffixes like release/v0.6.0-foo.
            if ! [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Branch '$BRANCH' is not a valid release branch. Expected release/vMAJOR.MINOR.PATCH (e.g. release/v0.6.0), got suffix '$BASE_VERSION'."
              exit 1
            fi
          else
            echo "::error::Workflow must be dispatched from a release/v* branch, got '$BRANCH'"
            exit 1
          fi
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cancel run if release already published
        # Pushes to release/v$VERSION after the production release has been cut
        # (typically manual merge-back fixups when merge-release-branch fails)
        # otherwise kick off a duplicate production run. workflow_dispatch is
        # left untouched because that path is always intentional (e.g. retrying
        # a failed publish step on an already-shipped version).
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE_VERSION="${{ steps.extract.outputs.base_version }}"
          HTTP_STATUS=$(curl -sSL -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v$BASE_VERSION")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "::warning::GitHub Release v$BASE_VERSION is already published. Cancelling this run to avoid a duplicate production run. Use workflow_dispatch if you need to retry a published version."
            curl -sSL -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" > /dev/null
            # Wait for the cancellation to land. If it doesn't, fall through and
            # fail-fast so downstream jobs don't run.
            sleep 60
            exit 1
          fi

      - name: Compute final version
        id: finalize
        run: |
          BASE_VERSION="${{ steps.extract.outputs.base_version }}"
          VERSION="$BASE_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Detect chrome extension changes
        id: detect-extension-changes
        env:
          BASE_VERSION: ${{ steps.extract.outputs.base_version }}
        run: |
          # Compare clients/chrome-extension/ against the previous release tag.
          # Exclude the current version's tag so retries after tagging still
          # detect minor/major bumps correctly.
          # If no prior tag exists (first release), always build.
          PREV_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | { grep -v "^v${BASE_VERSION}$" || true; } | head -1)

          # Force a build on minor/major version bumps so the CWS listing
          # stays in sync even when the extension code itself hasn't changed.
          if [ -n "$PREV_TAG" ]; then
            PREV_MAJOR_MINOR=$(echo "${PREV_TAG#v}" | cut -d. -f1-2)
            CURR_MAJOR_MINOR=$(echo "$BASE_VERSION" | cut -d. -f1-2)
            if [ "$PREV_MAJOR_MINOR" != "$CURR_MAJOR_MINOR" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Major/minor version changed ($PREV_MAJOR_MINOR -> $CURR_MAJOR_MINOR) — forcing extension build"
              exit 0
            fi
            CHANGED=$(git diff --name-only "$PREV_TAG"..HEAD -- clients/chrome-extension/ \
              ':!clients/chrome-extension/manifest.json' \
              ':!clients/chrome-extension/package.json' | wc -l | tr -d ' ')
          else
            CHANGED=1
          fi

          if [ "$CHANGED" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Chrome extension has $CHANGED changed file(s) since $PREV_TAG"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No chrome extension changes since $PREV_TAG — build & publish will be skipped"
          fi

  build-chrome-extension:
    needs: [extract-version]
    if: ${{ false }} # offline on this channel for now; bring back online by deleting this marker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install Chrome for CRX signing
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3
        with:
          chrome-version: stable

      - name: Install chrome-extension dependencies
        working-directory: clients/chrome-extension
        run: bun install --frozen-lockfile

      - name: Write CRX signing key
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -n "$CRX_PRIVATE_KEY" ]; then
            echo "$CRX_PRIVATE_KEY" > clients/chrome-extension/privatekey.pem
            chmod 600 clients/chrome-extension/privatekey.pem
          else
            echo "::warning::CRX_PRIVATE_KEY secret not set — CRX signing will be skipped"
          fi

      - name: Build extension
        working-directory: clients/chrome-extension
        env:
          VERSION: ${{ needs.extract-version.outputs.version }}
          CADET_ENVIRONMENT: production
        run: bash build.sh

      - name: Verify manifest version
        working-directory: clients/chrome-extension
        run: |
          EXPECTED="${{ needs.extract-version.outputs.version }}"
          # build.sh strips prerelease suffixes to satisfy Chrome's version
          # format requirement. Match that here.
          EXPECTED="${EXPECTED%%-*}"
          ACTUAL=$(jq -r '.version' dist/manifest.json)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Manifest version mismatch: expected $EXPECTED, got $ACTUAL"
            exit 1
          fi

      - name: Clean up signing key
        if: always()
        run: rm -f clients/chrome-extension/privatekey.pem

      - name: Upload extension CRX
        if: hashFiles('clients/chrome-extension/cadet-browser-relay.crx') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chrome-extension-crx
          path: clients/chrome-extension/cadet-browser-relay.crx
          retention-days: 90

      - name: Upload extension CRX (zipped for download)
        if: hashFiles('clients/chrome-extension/cadet-browser-relay.crx.zip') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chrome-extension-crx-zip
          path: clients/chrome-extension/cadet-browser-relay.crx.zip
          retention-days: 90

      - name: Upload extension zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chrome-extension-zip
          path: clients/chrome-extension/cadet-browser-relay.zip
          retention-days: 90

  publish-chrome-extension:
    needs:
      [
        extract-version,
        build-chrome-extension,
        push-assistant-manifest,
        push-gateway-manifest,
        push-credential-executor-manifest,
      ]
    if: ${{ false }} # offline on this channel for now; bring back online by deleting this marker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: clients/chrome-extension/extension-environments.json
          sparse-checkout-cone-mode: false

      - name: Read CWS extension ID
        id: read-extension-id
        run: echo "id=$(jq -r '.production.extensionId' clients/chrome-extension/extension-environments.json)" >> "$GITHUB_OUTPUT"

      - name: Download extension CRX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chrome-extension-crx
          path: /tmp/chrome-extension

      - name: Install chrome-webstore-upload-cli
        run: npm install -g chrome-webstore-upload-cli@4.0.0

      - name: Upload to Chrome Web Store
        env:
          EXTENSION_ID: ${{ steps.read-extension-id.outputs.id }}
          CLIENT_ID: ${{ vars.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: |
          # Extension has CRX Verified Uploads enabled — CWS requires a signed .crx
          UPLOAD_FILE=$(ls /tmp/chrome-extension/*.crx)
          echo "Uploading: $UPLOAD_FILE"
          set +e
          OUTPUT=$(chrome-webstore-upload upload \
            --source "$UPLOAD_FILE" \
            --extension-id "$EXTENSION_ID" 2>&1)
          EXIT=$?
          set -e
          echo "$OUTPUT"
          if [ $EXIT -ne 0 ] && echo "$OUTPUT" | grep -q "ITEM_NOT_UPDATABLE"; then
            echo "::notice::CWS already has this version pending/published — skipping upload (treating as retry)."
            exit 0
          fi
          exit $EXIT

      - name: Publish to Chrome Web Store
        env:
          EXTENSION_ID: ${{ steps.read-extension-id.outputs.id }}
          CLIENT_ID: ${{ vars.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: |
          chrome-webstore-upload publish \
            --extension-id "$EXTENSION_ID"


  push-assistant-image:
    needs: [extract-version, ci-assistant-lint, ci-assistant-types, ci-assistant-tests]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
        run: echo "$DOCKERHUB_ACCESS_TOKEN" | docker login -u mycadet --password-stdin
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Compute image name
        id: image
        run: |
          echo "image=docker.io/mycadet/${{ env.ASSISTANT_IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Stamp release version into package.json
        run: jq --arg v "${{ needs.extract-version.outputs.version }}" '.version = $v' assistant/package.json > assistant/package.json.tmp && mv assistant/package.json.tmp assistant/package.json

      - name: Sync feature flag registry for Docker context
        run: cp meta/feature-flags/feature-flag-registry.json assistant/src/config/feature-flag-registry.json

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: assistant/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ steps.image.outputs.image }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=assistant-release-${{ matrix.platform }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=assistant-release-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Prepare platform suffix
        id: platform
        run: |
          platform="${{ matrix.platform }}"
          echo "suffix=${platform//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assistant-digests-release-${{ steps.platform.outputs.suffix }}
          path: /tmp/digests/*
          retention-days: 1

  push-assistant-manifest:
    # The image job MUST be a direct need: needs.<job>.result only resolves
    # for jobs in this list, and the if below reads it. #143's port dropped
    # it, so every manifest silently skipped and nothing downstream ran.
    needs: [extract-version, push-assistant-image]
    if: ${{ always() && !cancelled() && needs.push-assistant-image.result == 'success' }}
    outputs:
      repository: ${{ steps.tags.outputs.image_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
        run: echo "$DOCKERHUB_ACCESS_TOKEN" | docker login -u mycadet --password-stdin
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: latest

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: assistant-digests-release-*
          merge-multiple: true

      - name: Compute image tags
        id: tags
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          SHORT_SHA="${{ needs.extract-version.outputs.short_sha }}"
          IMAGE_REF="docker.io/mycadet/${{ env.ASSISTANT_IMAGE_NAME }}"
          IMAGE_TAGS="${IMAGE_REF}:${{ github.sha }}"
          IMAGE_TAGS=$(printf "%s\n%s" "$IMAGE_TAGS" "${IMAGE_REF}:${VERSION}")
          IMAGE_TAGS=$(printf "%s\n%s" "$IMAGE_TAGS" "${IMAGE_REF}:latest")
          echo "image_tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$IMAGE_TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          IMAGE="${{ steps.tags.outputs.image_name }}"
          TAG_ARGS=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAG_ARGS="$TAG_ARGS -t $tag"
          done <<< "${{ steps.tags.outputs.image_tags }}"
          SOURCES=$(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools create $TAG_ARGS $SOURCES

      - name: Export manifest digest
        id: manifest-digest
        run: |
          IMAGE="${{ steps.tags.outputs.image_name }}"
          VERSION="${{ needs.extract-version.outputs.version }}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/manifest-digest
          echo "${DIGEST}" > /tmp/manifest-digest/digest
          echo "${IMAGE}" > /tmp/manifest-digest/repository

      - name: Upload manifest digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assistant-manifest-digest-dev
          path: /tmp/manifest-digest/*
          retention-days: 1

  push-gateway-image:
    needs: [extract-version, ci-gateway]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
        run: echo "$DOCKERHUB_ACCESS_TOKEN" | docker login -u mycadet --password-stdin
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Compute image name
        id: image
        run: |
          echo "image=docker.io/mycadet/${{ env.GATEWAY_IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Stamp release version into package.json
        run: jq --arg v "${{ needs.extract-version.outputs.version }}" '.version = $v' gateway/package.json > gateway/package.json.tmp && mv gateway/package.json.tmp gateway/package.json

      - name: Sync feature flag registry for Docker context
        run: cp meta/feature-flags/feature-flag-registry.json gateway/src/feature-flag-registry.json

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: gateway/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ steps.image.outputs.image }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=gateway-release-${{ matrix.platform }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=gateway-release-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Prepare platform suffix
        id: platform
        run: |
          platform="${{ matrix.platform }}"
          echo "suffix=${platform//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gateway-digests-release-${{ steps.platform.outputs.suffix }}
          path: /tmp/digests/*
          retention-days: 1

  push-gateway-manifest:
    # Direct need on the image job — see push-assistant-manifest above.
    needs: [extract-version, push-gateway-image]
    if: ${{ always() && !cancelled() && needs.push-gateway-image.result == 'success' }}
    outputs:
      repository: ${{ steps.tags.outputs.image_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
        run: echo "$DOCKERHUB_ACCESS_TOKEN" | docker login -u mycadet --password-stdin
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: latest

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: gateway-digests-release-*
          merge-multiple: true

      - name: Compute image tags
        id: tags
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          IMAGE_REF="docker.io/mycadet/${{ env.GATEWAY_IMAGE_NAME }}"
          IMAGE_TAGS="${IMAGE_REF}:${{ github.sha }}"
          IMAGE_TAGS=$(printf "%s\n%s" "$IMAGE_TAGS" "${IMAGE_REF}:${VERSION}")
          IMAGE_TAGS=$(printf "%s\n%s" "$IMAGE_TAGS" "${IMAGE_REF}:latest")
          echo "image_tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$IMAGE_TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          IMAGE="${{ steps.tags.outputs.image_name }}"
          TAG_ARGS=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAG_ARGS="$TAG_ARGS -t $tag"
          done <<< "${{ steps.tags.outputs.image_tags }}"
          SOURCES=$(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools create $TAG_ARGS $SOURCES

      - name: Export manifest digest
        id: manifest-digest
        run: |
          IMAGE="${{ steps.tags.outputs.image_name }}"
          VERSION="${{ needs.extract-version.outputs.version }}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/manifest-digest
          echo "${DIGEST}" > /tmp/manifest-digest/digest
          echo "${IMAGE}" > /tmp/manifest-digest/repository

      - name: Upload manifest digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gateway-manifest-digest-dev
          path: /tmp/manifest-digest/*
          retention-days: 1

  push-credential-executor-image:
    needs: [extract-version, ci-credential-executor]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
        run: echo "$DOCKERHUB_ACCESS_TOKEN" | docker login -u mycadet --password-stdin
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Compute image name
        id: image
        run: |
          echo "image=docker.io/mycadet/${{ env.CREDENTIAL_EXECUTOR_IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Stamp release version into package.json
        run: jq --arg v "${{ needs.extract-version.outputs.version }}" '.version = $v' credential-executor/package.json > credential-executor/package.json.tmp && mv credential-executor/package.json.tmp credential-executor/package.json

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: credential-executor/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ steps.image.outputs.image }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=credential-executor-release-${{ matrix.platform }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=credential-executor-release-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Prepare platform suffix
        id: platform
        run: |
          platform="${{ matrix.platform }}"
          echo "suffix=${platform//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: credential-executor-digests-release-${{ steps.platform.outputs.suffix }}
          path: /tmp/digests/*
          retention-days: 1

  push-credential-executor-manifest:
    # Direct need on the image job — see push-assistant-manifest above.
    needs: [extract-version, push-credential-executor-image]
    if: ${{ always() && !cancelled() && needs.push-credential-executor-image.result == 'success' }}
    outputs:
      repository: ${{ steps.tags.outputs.image_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
        run: echo "$DOCKERHUB_ACCESS_TOKEN" | docker login -u mycadet --password-stdin
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: latest

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: credential-executor-digests-release-*
          merge-multiple: true

      - name: Compute image tags
        id: tags
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          IMAGE_REF="docker.io/mycadet/${{ env.CREDENTIAL_EXECUTOR_IMAGE_NAME }}"
          IMAGE_TAGS="${IMAGE_REF}:${{ github.sha }}"
          IMAGE_TAGS=$(printf "%s\n%s" "$IMAGE_TAGS" "${IMAGE_REF}:${VERSION}")
          IMAGE_TAGS=$(printf "%s\n%s" "$IMAGE_TAGS" "${IMAGE_REF}:latest")
          echo "image_tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$IMAGE_TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          IMAGE="${{ steps.tags.outputs.image_name }}"
          TAG_ARGS=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAG_ARGS="$TAG_ARGS -t $tag"
          done <<< "${{ steps.tags.outputs.image_tags }}"
          SOURCES=$(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools create $TAG_ARGS $SOURCES

      - name: Export manifest digest
        id: manifest-digest
        run: |
          IMAGE="${{ steps.tags.outputs.image_name }}"
          VERSION="${{ needs.extract-version.outputs.version }}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/manifest-digest
          echo "${DIGEST}" > /tmp/manifest-digest/digest
          echo "${IMAGE}" > /tmp/manifest-digest/repository

      - name: Upload manifest digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: credential-executor-manifest-digest-dev
          path: /tmp/manifest-digest/*
          retention-days: 1

  push-docs-image:
    needs: [extract-version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
        run: echo "$DOCKERHUB_ACCESS_TOKEN" | docker login docker.io -u mycadet --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: clients/docs/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/mycadet/docs-site:${{ needs.extract-version.outputs.version }}
            docker.io/mycadet/docs-site:latest
