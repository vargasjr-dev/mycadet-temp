  tag-staging-release:
    needs:
      [extract-version, push-assistant-manifest, push-gateway-manifest, push-credential-executor-manifest]
    if: >-
      ${{
        always() && !cancelled()
        && needs.extract-version.outputs.is_staging == 'true'
        && needs.push-assistant-manifest.result == 'success'
        && needs.push-gateway-manifest.result == 'success'
        && needs.push-credential-executor-manifest.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the vX.Y.Z-staging.N tag
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Tag staging release
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          echo "Tagged staging release: v${VERSION}"
  build-npm-prod:
    # Build has no side effects; release-ordering gates live on publish-npm-prod.
    needs: [extract-version, ci-cli, ci-gateway]
    if: ${{ always() && !cancelled() && needs.extract-version.outputs.is_staging != 'true' && needs.ci-cli.result == 'success' && needs.ci-gateway.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      matrix:
        package: [assistant, cli, credential-executor, gateway]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Sync feature flag registry for publish
        run: bun run meta/sync-bundled-copies.ts

      - name: Install package dependencies
        run: |
          if ! bun install --frozen-lockfile --filter="./${{ matrix.package }}"; then
            echo "bun install --frozen-lockfile failed; regenerating lockfile and retrying..."
            rm -f bun.lock
            rm -rf node_modules
            bun install --filter="./${{ matrix.package }}"
          fi
      # bun pm pack bundles the workspace deps listed in bundledDependencies
      # and rewrites workspace:* to concrete versions; npm pack does neither
      # for symlinked workspace deps.
      - name: Strip bundled deps from the manifest
        run: bun scripts/strip-bundled-deps.mjs "${{ matrix.package }}"
      - name: Pack tarball
        run: |
          cd "${{ matrix.package }}"
          mkdir -p /tmp/npm-dist
          bun pm pack --destination /tmp/npm-dist
          mv /tmp/npm-dist/*.tgz /tmp/npm-dist/package.tgz
          bun ../scripts/strip-bundled-field-from-tarball.mjs /tmp/npm-dist/package.tgz
          node -p "require('./package.json').name" > /tmp/npm-dist/name
          node -p "require('./package.json').version" > /tmp/npm-dist/version
      - name: Upload tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarball-prod-${{ matrix.package }}
          path: /tmp/npm-dist/
          retention-days: 1

  publish-npm-prod:
    permissions:
      contents: read
     
    strategy:
      matrix:
        package: [assistant, cli, credential-executor, gateway]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Download tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarball-prod-${{ matrix.package }}
          path: /tmp/npm-dist

      - name: Publish package
        run: |
          PKG_NAME=$(cat /tmp/npm-dist/name)
          PKG_VERSION=$(cat /tmp/npm-dist/version)
          EXPECTED_VERSION="${{ needs.extract-version.outputs.version }}"
          # Guard against a version desync: the tarball is packed straight from
          # the branch's package.json, so if the release branch was never bumped
          # to $EXPECTED_VERSION the "already published" check below matches the
          # PREVIOUS release and silently skips publishing while the job still
          # goes green. Fail loudly instead of reporting a false success.
          if [ "$PKG_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::$PKG_NAME is packaged as v$PKG_VERSION but this release is v$EXPECTED_VERSION — the release branch's package.json was not bumped to v$EXPECTED_VERSION. Refusing to skip/succeed without publishing v$EXPECTED_VERSION."
            exit 1
          fi
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::notice::$PKG_NAME@$PKG_VERSION already published; skipping (treating as retry)."
            exit 0
          fi
          npm publish /tmp/npm-dist/package.tgz --access public

  # `@mycadet/plugin-api` is the public TypeScript authoring contract external
  # plugins compile against. Unlike the other npm packages it is not a package
  # directory `npm pack` can consume directly: scripts/build-plugin-api.ts rolls
  # the plugin-api surface into a single self-contained `index.d.ts` (API
  # Extractor, zod-only external) and stamps the release version, so it gets its
  # own build/publish pair rather than a slot in the npm matrix. Published in
  # lockstep with the assistant version the loader's peerDependency gate expects.
  build-plugin-api-prod:
    # Build has no side effects; release-ordering gates live on publish-plugin-api-prod.
    needs: [extract-version, ci-cli, ci-gateway]
    if: ${{ always() && !cancelled() && needs.extract-version.outputs.is_staging != 'true' && needs.ci-cli.result == 'success' && needs.ci-gateway.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
