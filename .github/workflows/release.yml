  # `@mycadet/plugin-api` is the public TypeScript authoring contract external
  # plugins compile against. Unlike the other npm packages it is not a package
  # directory `npm pack` can consume directly: scripts/build-plugin-api.ts rolls
  # the plugin-api surface into a single self-contained `index.d.ts` (API
  # Extractor, zod-only external) and stamps the release version, so it gets its
  # own publish job rather than a slot in the npm matrix. Published in
  # lockstep with the assistant version the loader's peerDependency gate expects.
  publish-plugin-api-prod:
    needs: [extract-version, ci-assistant-lint, ci-assistant-types, ci-assistant-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: |
          if ! bun install --frozen-lockfile --filter=@mycadet/assistant; then
            echo "bun install --frozen-lockfile failed; regenerating lockfile and retrying..."
            rm -f bun.lock
            bun install --filter=@mycadet/assistant
          fi
      - name: Build plugin-api package
        run: cd assistant && bun run scripts/build-plugin-api.ts --version "${{ needs.extract-version.outputs.version }}"
      - name: Pack tarball
        run: |
          cd assistant/.plugin-api-build/package
          mkdir -p /tmp/npm-dist
          npm pack --pack-destination /tmp/npm-dist
          mv /tmp/npm-dist/*.tgz /tmp/npm-dist/package.tgz
      - name: Publish package
        run: |
          PKG_NAME=$(node -p "require('./assistant/.plugin-api-build/package/package.json').name")
          PKG_VERSION=$(node -p "require('./assistant/.plugin-api-build/package/package.json').version")
          EXPECTED_VERSION="${{ needs.extract-version.outputs.version }}"
