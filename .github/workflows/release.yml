  publish-npm-assistant-prod:
    needs: [extract-version, ci-assistant-lint, ci-assistant-types, ci-assistant-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Sync feature flag registry for publish
        run: bun run meta/sync-bundled-copies.ts
      - name: Install package dependencies
        run: |
          if ! bun install --frozen-lockfile --filter="./assistant"; then
            echo "bun install --frozen-lockfile failed; regenerating lockfile and retrying..."
            rm -f bun.lock
            rm -rf node_modules
            bun install --filter="./assistant"
          fi
      # bun pm pack bundles the workspace deps listed in bundledDependencies
      # and rewrites workspace:* to concrete versions; npm pack does neither
      # for symlinked workspace deps.
      - name: Strip bundled deps from the manifest
        run: bun scripts/strip-bundled-deps.mjs assistant
      - name: Pack tarball
        run: |
          cd assistant
          mkdir -p /tmp/npm-dist
          bun pm pack --destination /tmp/npm-dist
          mv /tmp/npm-dist/*.tgz /tmp/npm-dist/package.tgz
          bun ../scripts/strip-bundled-field-from-tarball.mjs /tmp/npm-dist/package.tgz
      - name: Publish package
        run: |
          PKG_NAME=$(node -p "require('./assistant/package.json').name")
          PKG_VERSION=$(node -p "require('./assistant/package.json').version")
          EXPECTED_VERSION="${{ needs.extract-version.outputs.version }}"
          # Guard against a version desync: the tarball is packed straight from
          # the branch's package.json, so if the release branch was never bumped
          # to $EXPECTED_VERSION the "already published" check below matches the
          # PREVIOUS release and silently skips publishing while the job still
          # goes green. Fail loudly instead of reporting a false success.
          if [ "$PKG_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::$PKG_NAME is packaged as v$PKG_VERSION but this release is v$EXPECTED_VERSION — the release branch's package.json was not bumped to v$EXPECTED_VERSION. Refusing to skip/succeed without publishing v$EXPECTED_VERSION."
            exit 1
          fi
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::notice::$PKG_NAME@$PKG_VERSION already published; skipping (treating as retry)."
            exit 0
          fi
          npm publish /tmp/npm-dist/package.tgz --access public


