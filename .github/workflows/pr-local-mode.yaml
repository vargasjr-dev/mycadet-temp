name: PR Local Mode Checks

on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      # Only what @mycadet/local-mode actually consumes (its workspace:*
      # dep closure — kept in lockstep with packages/local-mode/package.json),
      # plus the shared inputs its checks read.
      - "package.json"
      - "bun.lock"
      - "patches/**"
      - "packages/local-mode/**"
      - "packages/avatar-manifest/**"
      - "packages/environments/**"
      - "packages/ipc-server-utils/**"
      - "packages/service-contracts/**"
      - "packages/shared/**"
      - ".github/workflows/pr-local-mode.yaml"
  workflow_dispatch:
concurrency:
  group: pr-local-mode-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type Check & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: packages/local-mode

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/local-mode

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test
