name: PR QA

on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      # Only qa changes — this workflow exists to protect releases, not to
      # gate source code (the source packages' own PR workflows do that).
      - "qa/**"
      - ".github/workflows/pr-qa.yaml"
  workflow_dispatch:

concurrency:
  group: pr-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type Check & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/qa

      - name: Type check
        working-directory: qa
        run: bun run typecheck

      - name: Unit tests
        working-directory: qa
        # The unit tests only — docker-hatch.test.ts fails without image
        # refs by design (a release must never pass because its detector
        # was unconfigured); it runs in the integration job.
        run: bun test index.test.ts

  integration:
    name: Edited Integration Tests
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so the merge base against the PR's base branch is
          # always computable.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Resolve edited qa tests
        id: edited
        run: |
          BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          EDITED=$(git diff --name-only "$BASE_SHA" HEAD -- qa/ | grep -E '(^|/)[^/]*\.test\.ts$' | sed 's|^qa/||' || true)
          COUNT=$(printf '%s\n' "$EDITED" | grep -c . || true)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo 'files<<EOF'
            echo "$EDITED"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "Edited qa test files ($COUNT):"
          echo "$EDITED"

      - name: Skip — no qa tests edited in this PR
        if: ${{ steps.edited.outputs.count == '0' }}
        run: echo "No qa tests were edited in this PR — the docker hatch suite only runs on edited tests. Add or edit a test under qa/ to iterate on it here."

      - name: Install dependencies
        if: ${{ steps.edited.outputs.count != '0' }}
        run: bun install --frozen-lockfile --filter=@mycadet/qa --filter=@mycadet/cli

      - name: Set up Docker Buildx
        if: ${{ steps.edited.outputs.count != '0' }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The hatch boots all three service images built from THIS PR's source
      # — the same images the release pipeline ships — so a PR can iterate
      # on the integration suite against the real container start path.
      - name: Build assistant image
        if: ${{ steps.edited.outputs.count != '0' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: assistant/Dockerfile
          tags: qa-pr-assistant:pr
          load: true
          cache-from: type=gha,scope=qa-pr-assistant
          cache-to: type=gha,mode=max,ignore-error=true,scope=qa-pr-assistant

      - name: Build gateway image
        if: ${{ steps.edited.outputs.count != '0' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: gateway/Dockerfile
          tags: qa-pr-gateway:pr
          load: true
          cache-from: type=gha,scope=qa-pr-gateway
          cache-to: type=gha,mode=max,ignore-error=true,scope=qa-pr-gateway

      - name: Build credential-executor image
        if: ${{ steps.edited.outputs.count != '0' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: credential-executor/Dockerfile
          tags: qa-pr-credential-executor:pr
          load: true
          cache-from: type=gha,scope=qa-pr-credential-executor
          cache-to: type=gha,mode=max,ignore-error=true,scope=qa-pr-credential-executor

      - name: Run the edited qa tests
        if: ${{ steps.edited.outputs.count != '0' }}
        working-directory: qa
        env:
          CADET_ASSISTANT_IMAGE: qa-pr-assistant:pr
          CADET_GATEWAY_IMAGE: qa-pr-gateway:pr
          CADET_CREDENTIAL_EXECUTOR_IMAGE: qa-pr-credential-executor:pr
        run: bun test ${{ steps.edited.outputs.files }}
