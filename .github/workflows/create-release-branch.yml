name: Create Release Branch

on:
  # Tue/Thu 7:52am ET cron is off. Cut a branch with workflow_dispatch.
  # schedule:
  #   # Release at 7:52am ET every Tuesday and Thursday. Two entries cover EDT
  #   # (UTC-4) and EST (UTC-5); schedule-guard picks the one matching today's
  #   # offset and drops the other.
  #   - cron: "52 11 * * 2,4"  # EDT: 7:52am ET
  #   - cron: "52 12 * * 2,4"  # EST: 7:52am ET
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          # hotfix: patch bump cut from the latest *release tag's* commit
          # (not main HEAD), committed with [skip ci] so no production release
          # runs until hotfixes are manually cherry-picked onto the branch.
          - hotfix

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  schedule-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor == 'dvargasfuertes'
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Pick the cron entry matching today's ET offset
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Two cron entries fire (11:52 and 12:52 UTC) to cover EDT/EST. Run
          # only the entry matching today's Eastern offset so the release fires
          # once. Keying off the triggering cron (not the wall-clock hour at job
          # start) stays correct even when GitHub delays the scheduled run.
          OFFSET=$(TZ=America/New_York date +%z)
          if [ "$OFFSET" = "-0400" ]; then
            EXPECTED="52 11 * * 2,4"  # EDT: 7:52am ET = 11:52 UTC
          else
            EXPECTED="52 12 * * 2,4"  # EST: 7:52am ET = 12:52 UTC
          fi
          if [ "${{ github.event.schedule }}" != "$EXPECTED" ]; then
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should-run=true" >> "$GITHUB_OUTPUT"

  compute-version:
    needs: schedule-guard
    if: needs.schedule-guard.outputs.should-run == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.compute.outputs.version }}
      base-ref: ${{ steps.compute.outputs.base-ref }}
      skip-ci: ${{ steps.compute.outputs.skip-ci }}
      bump: ${{ steps.compute.outputs.bump }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Compute version from bump type
        id: compute
        env:
          NEXT_RELEASE_BUMP: ${{ vars.NEXT_RELEASE_BUMP }}
        run: |
          # Scheduled cuts take their bump type from the NEXT_RELEASE_BUMP
          # repository variable (Settings → Secrets and variables → Actions →
          # Variables, or `gh variable set NEXT_RELEASE_BUMP --body minor`).
          # The variable is one-shot: the create-release-branch job resets it
          # to patch after a successful scheduled cut, so setting it to minor
          # or major upgrades exactly one scheduled tick. Unset or "patch"
          # means the usual patch release. Manual dispatches use the bump
          # input and never read or reset the variable.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUMP="${{ inputs.bump }}"
          else
            BUMP="${NEXT_RELEASE_BUMP:-patch}"
            case "$BUMP" in
              patch|minor|major) ;;
              *)
                echo "::error::NEXT_RELEASE_BUMP repository variable is '$BUMP' — scheduled cuts accept patch, minor, or major (hotfix is dispatch-only)."
                exit 1
                ;;
            esac
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          LATEST_VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch|hotfix) PATCH=$((PATCH + 1)) ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # A hotfix is a patch release cut from the latest release tag's commit
          # rather than from main HEAD, and committed with [skip ci] so the push
          # doesn't kick off a production release — the branch is meant to receive
          # manually cherry-picked fixes first. patch/minor/major all cut from
          # main HEAD and run CI as usual (base-ref empty, skip-ci false).
          if [ "$BUMP" = "hotfix" ]; then
            BASE_REF=$(git rev-list -n 1 "$LATEST_TAG")
            echo "Hotfix: branching from $LATEST_TAG ($BASE_REF)"
            echo "base-ref=$BASE_REF" >> "$GITHUB_OUTPUT"
            echo "skip-ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "base-ref=" >> "$GITHUB_OUTPUT"
            echo "skip-ci=false" >> "$GITHUB_OUTPUT"
          fi

  create-release-branch:
    needs: compute-version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # cut/push/delete the release + cherry-pick branches
      actions: write # reset the NEXT_RELEASE_BUMP variable
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # The release/** ruleset (release-branches-push-restriction) blocks
      # GITHUB_TOKEN pushes — the automation app is on that ruleset's bypass
      # list instead. Mint its token and repoint origin so every origin
      # mutation below (branch delete/create/push) runs as the bypassed
      # actor. An app-token push also triggers release.yml natively, which
      # replaces the old explicit dispatch (GITHUB_TOKEN pushes never fired
      # it — GitHub anti-recursion).
      - name: Mint the automation app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CADET_AUTOMATION_GITHUB_APP_ID }}
          private-key: ${{ secrets.CADET_AUTOMATION_GITHUB_PRIVATE_KEY }}
          owner: vargasjr-dev
          repos: mycadet-temp

      # Hotfix releases install + generate from the latest release tag's tree,
      # not main HEAD. Check out that commit before installing so lockfiles and
      # node_modules match. For patch/minor/major, base-ref is empty and this is
      # a no-op (we stay on main HEAD).
      - name: Check out hotfix base ref
        if: ${{ needs.compute-version.outputs.base-ref != '' }}
        run: git checkout "${{ needs.compute-version.outputs.base-ref }}"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      # Hotfix releases can check out a pre-workspace tag (no root bun.lock);
      # those trees still install per package.
      - name: Install dependencies
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile --filter=@mycadet/assistant
          else
            for pkg in packages/*/ assistant; do
              [ -f "$pkg/package.json" ] || continue
              (cd "$pkg" && bun install --frozen-lockfile)
            done
          fi

      - name: Disable local git hooks
        run: git config --unset core.hooksPath || true

      - name: Create release branch and bump versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.compute-version.outputs.version }}"
          BASE_REF="${{ needs.compute-version.outputs.base-ref }}"
          SKIP_CI="${{ needs.compute-version.outputs.skip-ci }}"
          BRANCH="release/v$VERSION"
          CHERRY_PICK_BRANCH="cherry-pick/$BRANCH"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Push as the bypassed automation app (see the mint step above) —
          # the release/** ruleset rejects workflow-token pushes.
          git remote set-url origin "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/vargasjr-dev/mycadet-temp.git"

          # Delete existing cherry-pick branch if it exists (must happen before release branch)
          if git ls-remote --exit-code origin "$CHERRY_PICK_BRANCH" >/dev/null 2>&1; then
            echo "Deleting existing cherry-pick branch: $CHERRY_PICK_BRANCH"
            git push origin --delete "$CHERRY_PICK_BRANCH"
          fi

          # Delete existing release branch if it exists
          if git ls-remote --exit-code origin "$BRANCH" >/dev/null 2>&1; then
            echo "Deleting existing release branch: $BRANCH"
            git push origin --delete "$BRANCH"
          fi

          # Hotfix releases branch from the latest release tag's commit so the
          # patch contains only the released code (plus fixes cherry-picked
          # later). Other bump types branch from the checked-out main HEAD.
          if [ -n "$BASE_REF" ]; then
            echo "Creating $BRANCH from $BASE_REF"
            git checkout -b "$BRANCH" "$BASE_REF"
          else
            git checkout -b "$BRANCH"
          fi

          # Bump all package.json files
          # NOTE: Service + client versions stay in sync. The Electron macOS app
          # stamps this same version into clients/macos/package.json at build time
          # (see the build-electron job in release.yml).
          for pkg in assistant cli credential-executor gateway meta; do
            jq --arg v "$VERSION" '.version = $v' $pkg/package.json > tmp && mv tmp $pkg/package.json
          done
          jq --arg v "$VERSION" '.version = $v' clients/web/package.json > tmp && mv tmp clients/web/package.json
          jq --arg v "$VERSION" '.version = $v' clients/app/package.json > tmp && mv tmp clients/app/package.json

          # Bump meta-package dependency versions
          jq --arg v "$VERSION" '
            .dependencies["@mycadet/assistant"] = $v |
            .dependencies["@mycadet/cli"] = $v |
            .dependencies["@mycadet/credential-executor"] = $v |
            .dependencies["@mycadet/gateway"] = $v |
            .dependencies["@mycadet/app"] = $v |
            .dependencies["@mycadet/web"] = $v
          ' meta/package.json > tmp && mv tmp meta/package.json

          # Bump Chrome extension version (manifest.json + package.json)
          jq --arg v "$VERSION" '.version = $v' clients/chrome-extension/manifest.json > tmp && mv tmp clients/chrome-extension/manifest.json
          jq --arg v "$VERSION" '.version = $v' clients/chrome-extension/package.json > tmp && mv tmp clients/chrome-extension/package.json
          # Refresh the workspace lockfile so the committed member versions
          # match the bumped manifests. Pre-workspace hotfix tags have no
          # root lockfile and skip this.
          if [ -f bun.lock ]; then
            bun install --lockfile-only
          fi

          # Regenerate OpenAPI spec with the new version
          cd assistant && bun run generate:openapi && cd ..

          # Hotfix commits carry [skip ci] so pushing the branch doesn't trigger
          # a production release run — the branch is cut quietly and only releases
          # once fixes have been cherry-picked and CI is run intentionally.
          COMMIT_MSG="Release v$VERSION"
          if [ "$SKIP_CI" = "true" ]; then
            COMMIT_MSG="Release v$VERSION [skip ci]"
          fi

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "$COMMIT_MSG"
          fi
          git push --no-verify origin "$BRANCH"

      # NEXT_RELEASE_BUMP is one-shot: a scheduled cut that consumed a
      # minor/major value resets it to patch so the next tick reverts to the
      # normal cadence. Requires the workflow token to have the Variables
      # permission (actions: write, granted at job level). A failure here is
      # loud on purpose — a stale minor/major value would silently upgrade
      # every following scheduled release.
      - name: Reset NEXT_RELEASE_BUMP to patch
        if: ${{ github.event_name == 'schedule' && needs.compute-version.outputs.bump != 'patch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH \
            "repos/${{ github.repository }}/actions/variables/NEXT_RELEASE_BUMP" \
            -f name=NEXT_RELEASE_BUMP \
            -f value=patch
          echo "Consumed NEXT_RELEASE_BUMP=${{ needs.compute-version.outputs.bump }}; reset to patch."
