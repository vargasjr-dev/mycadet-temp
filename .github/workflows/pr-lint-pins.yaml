name: PR Lint Pins

on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - "scripts/check-lint-pins.ts"
      - ".github/workflows/pr-lint-pins.yaml"
      - "**/package.json"
      - "**/scripts/lint.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins-only-move-down:
    name: Countdown pins never rise
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      # The script fetches origin/main itself (depth 1) so a stale local
      # ref can't hide a rise; the checkout's shallow clone is all it needs.
      - name: Check the pins
        run: bun scripts/check-lint-pins.ts
