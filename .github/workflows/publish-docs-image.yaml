name: Publish Docs Image

# Builds the docs-site image and publishes it to Docker Hub — the
# open-source side stops there. The platform repo's github-handler receives
# the workflow_run webhook for this workflow, finds the Docker Hub upload
# for the run's head SHA, copies it into the project's Artifact Registry,
# and rolls the docs-site Cloud Run service. Everything GCP-specific lives
# platform-side; this repo has zero knowledge of GCP.

on:
  workflow_dispatch:

# Cancel superseded publishes: concurrency groups run in arbitrary order,
# so cancelling older runs is what guarantees the newest commit's build is
# the one that tags `latest`. A cancelled run skips its SHA tag; only the
# newest image matters.
concurrency:
  group: publish-docs-image
  cancel-in-progress: true

jobs:
  push-docs-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # dev carries DOCKERHUB_ACCESS_TOKEN (piped from the platform's Secret
    # Manager); the docs image is environment-agnostic.
    environment: dev
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_ACCESS_TOKEN }}" | docker login docker.io -u mycadet --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Single-arch: the docs-site Cloud Run service runs amd64. First push
      # auto-creates the public mycadet/docs-site repo on Docker Hub.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: clients/docs/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/mycadet/docs-site:${{ github.sha }}
            docker.io/mycadet/docs-site:latest
          cache-from: type=gha,scope=docs-site
          cache-to: type=gha,mode=max,ignore-error=true,scope=docs-site
