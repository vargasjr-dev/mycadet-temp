name: Deploy Web SPA (reusable)

# Reusable workflow: build + package the SPA for ONE GitHub environment.
#
# The bundle is built per environment so it bakes in that environment's
# public config, then uploaded as a workflow artifact. Publishing used to
# happen here too (GCS via WIF) — removed; nothing publishes to GCP today.
#
# `environment:` only resolves secrets and vars; none gate on required
# reviewers.
on:
  workflow_call:
    inputs:
      environment:
        description: Target GitHub environment (dev | staging | production).
        required: true
        type: string
      channel:
        description: >-
          Publish channel: stable overwrites the root index.html; any other
          value writes <channel>/index.html and leaves root untouched.
        required: false
        type: string
        default: stable

jobs:
  build-and-package:
    name: Build SPA (${{ inputs.environment }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    environment: ${{ inputs.environment }}
    # No id-token: this job runs untrusted build code and must never hold cloud
    # credentials.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/web

      - name: Generate API clients
        run: bun run openapi-ts

      # Build per environment so the bundle bakes in this environment's public
      # config — the Stripe publishable key differs per env (pk_test_ vs pk_live_)
      # and the environment tag must match. Sources, per the GitHub config:
      #   - VITE_ENVIRONMENT  per-environment variable (resolves via the
      #                              job's `environment:`)
      #   - VITE_SESSION_REPLAY_APP_ID  repo-level variable; one ID across all
      #                              surfaces (web/Electron/iOS). Unset disables
      #                              session replay. Public, so baking it in is
      #                              expected.
      #   - VITE_ANDROID_PLAY_STORE_URL  environment variable set only after
      #                              the production Play listing is live.
      #                              Unset keeps Android promotion disabled.
      #   - VITE_STRIPE_PUBLISHABLE_KEY  per-environment secret; publishable keys
      #                              are public, so embedding them is expected
      #   - VITE_TUNNEL_HOST          per-environment variable: the live-voice
      #                              tunnel host (no scheme), e.g.
      #                              `tunnel-dev.mycadet.ai` on nonprod. Unset in
      #                              prod, where the client defaults to
      #                              `tunnel.mycadet.ai`. Must match the tunnel the
      #                              environment's assistant gateways tunnel to,
      #                              or the live-voice WS upgrade 503s "offline".
      #   - VITE_APP_VERSION         commit SHA baked into the browser bundle
      #                              for release tagging.
      #   - VITE_CHANNEL             publish channel baked into the bundle.
      # The API base URL is not baked in: in the browser the client uses
      # same-origin paths, so each bucket's origin reaches its own backend.
      - name: Build
        env:
          VITE_CLOUD_MODE: "true"
          VITE_WEB_MODE: "full"
          VITE_ENVIRONMENT: ${{ vars.VITE_ENVIRONMENT }}
          VITE_SESSION_REPLAY_APP_ID: ${{ vars.VITE_SESSION_REPLAY_APP_ID }}
          VITE_ANDROID_PLAY_STORE_URL: ${{ vars.VITE_ANDROID_PLAY_STORE_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          VITE_TUNNEL_HOST: ${{ vars.VITE_TUNNEL_HOST }}
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_CHANNEL: ${{ inputs.channel }}
        run: bun run build

      # `path` is resolved from the workspace root and is NOT affected by the
      # job's `working-directory` default, so it must be the full `clients/web/dist`.
      - name: Upload SPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist-${{ inputs.environment }}-${{ inputs.channel }}
          path: clients/web/dist
          if-no-files-found: error
