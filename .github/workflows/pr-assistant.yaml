name: PR Assistant Checks

on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]
    paths:
      - "package.json"
      - "patches/**"
      - "assistant/**"
      - "packages/app-icons/**"
      - "packages/avatar-catalog/**"
      - "packages/avatar-manifest/**"
      - "packages/ces-client/**"
      - "packages/credential-storage/**"
      - "packages/egress-proxy/**"
      - "packages/environments/**"
      - "packages/gateway-client/**"
      - "packages/ipc-server-utils/**"
      - "packages/service-contracts/**"
      - "packages/slack-text/**"
      - "packages/twilio-client/**"
      - "scripts/skills/**"
      - "meta/feature-flags/**"
      - "meta/sync-bundled-copies.ts"
      - "meta/llm-provider-catalog.json"
      - ".github/workflows/pr-assistant.yaml"
  workflow_dispatch:
concurrency:
  group: pr-assistant-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    defaults:
      run:
        working-directory: assistant
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 200
          fetch-tags: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Cache bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/assistant --filter=@mycadet/gateway

      - name: Sync feature flag registry
        run: cd .. && bun run meta/sync-bundled-copies.ts

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Lint unused code
        run: bun run lint:unused

      - name: Type check
        run: bunx tsc --noEmit

      - name: Test
        env:
          EXCLUDE_EXPERIMENTAL: "true"
          TEST_WORKERS: "8"
          TEST_DIFF_ONLY: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        run: bun run test
