name: PR Gateway Checks

on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      # Only what @mycadet/gateway actually consumes (its workspace:*
      # dep closure — kept in lockstep with gateway/package.json), plus the
      # shared inputs its checks read.
      - "package.json"
      - "patches/**"
      - "gateway/**"
      - "packages/assistant-client/**"
      - "packages/ces-client/**"
      - "packages/environments/**"
      - "packages/gateway-client/**"
      - "packages/ipc-server-utils/**"
      - "packages/service-contracts/**"
      - "packages/shared/**"
      - "packages/slack-text/**"
      - "packages/twilio-client/**"
      - "meta/feature-flags/**"
      - "meta/sync-bundled-copies.ts"
      - ".github/workflows/pr-gateway.yaml"
  workflow_dispatch:
concurrency:
  group: pr-gateway-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 200
          fetch-tags: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/gateway

      - name: Sync feature flag registry
        run: cd .. && bun run meta/sync-bundled-copies.ts

      - name: Lint
        run: bun run lint

      - name: Lint unused code
        run: bun run lint:unused

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test
        env:
          TEST_DIFF_ONLY: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
