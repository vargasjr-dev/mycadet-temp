name: PR Android Checks

on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - 'clients/android/**'
      - '.github/actions/setup-android-sdk/**'

  workflow_dispatch:
concurrency:
  group: pr-android-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/android-checks.yaml
