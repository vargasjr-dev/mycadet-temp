name: PR Android Checks

on:
  # rebrand(cadet): PR triggers disabled for the CI-minute budget.
  # Vargas re-enables by uncommenting this block.
  # pull_request:
  #   types: [synchronize, opened, reopened]
  #   paths:
  #     - 'package.json'
  #     - 'bun.lock'
  #     - 'patches/**'
  #     - 'clients/android/**'
  #     - 'clients/app/capacitor.config.base.ts'
  #     - 'clients/app/capacitor-shell/**'
  #     - 'clients/app/package.json'
  #     - '.github/actions/setup-android-sdk/**'
  #     - '.github/workflows/android-checks.yaml'
  #     - '.github/workflows/pr-android.yaml'
  #     - '.github/workflows/ci-main-android.yaml'
  #     - '.github/workflows/release-android.yaml'
  #
  workflow_dispatch:
concurrency:
  group: pr-android-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/android-checks.yaml
