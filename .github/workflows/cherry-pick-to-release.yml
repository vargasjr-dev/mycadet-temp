name: Cherry Pick to Release Branch

on:
  # A backport writes to the base repository, including for merged fork PRs.
  pull_request_target:
    branches: [main]
    types: [closed, labeled]

jobs:
  cherry-pick:
    # Only ever act on merged PRs. Two entry points:
    #   - closed:  the label was already present at merge time.
    #   - labeled: the 'cherry-pick-to-release' label was added, and the PR is
    #              already merged (labeling an open PR is a no-op here — the
    #              subsequent 'closed'/merge event will cover it).
    if: >-
      github.event.pull_request.merged == true &&
      (
        (github.event.action == 'closed' &&
          contains(github.event.pull_request.labels.*.name, 'cherry-pick-to-release')) ||
        (github.event.action == 'labeled' &&
          github.event.label.name == 'cherry-pick-to-release')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the cherry-pick branch
      pull-requests: write # open + comment on the cherry-pick PR
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Use trusted base-branch code for the write-enabled workflow.
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Determine latest release branch
        id: release
        run: |
          # Find the latest release/v* branch by semantic version sort.
          # Use -V (version sort) on the first key so that the 'release/v'
          # prefix is handled correctly across major versions.
          # Filter to only clean semver branches (release/vX.Y.Z), excluding
          # branches with suffixes like release/v0.6.0-foo.
          LATEST_BRANCH=$(git branch -r --list 'origin/release/v*' \
            | sed 's|origin/||; s/^[[:space:]]*//' \
            | grep -E '^release/v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -t. -k1,1V -k2,2n -k3,3n \
            | tail -1)

          if [ -z "$LATEST_BRANCH" ]; then
            echo "::error::No release branches found matching 'release/v*'"
            exit 1
          fi

          echo "branch=$LATEST_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Latest release branch: $LATEST_BRANCH"

      - name: Cherry-pick and create PR
        id: cherry-pick
        env:
          # A fine-grained token scoped to this repository needs write access
          # to Contents, Workflows, and Pull requests.
          GH_TOKEN: ${{ secrets.RELEASE_BACKPORT_TOKEN || github.token }}
          HAS_BACKPORT_TOKEN: ${{ secrets.RELEASE_BACKPORT_TOKEN != '' }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Keep failed or manually superseded backports isolated by PR.
          CHERRY_PICK_BRANCH="backport/${RELEASE_BRANCH}/pr-${PR_NUMBER}"
          RELEASE_TIP="origin/${RELEASE_BRANCH}"
          git switch -c "$CHERRY_PICK_BRANCH" "$RELEASE_TIP"

          # Detect whether the merge commit has multiple parents (true merge)
          # or a single parent (squash merge). Only pass -m 1 for true merges.
          PARENT_COUNT=$(git cat-file -p "$MERGE_SHA" | grep -c '^parent')
          CHERRY_PICK_ARGS="--no-edit --empty=drop -x"
          if [ "$PARENT_COUNT" -gt 1 ]; then
            CHERRY_PICK_ARGS="-m 1 $CHERRY_PICK_ARGS"
          fi

          if git cherry-pick $CHERRY_PICK_ARGS "$MERGE_SHA"; then
            if git diff --quiet "$RELEASE_TIP" HEAD; then
              echo "::notice::#${PR_NUMBER} is already on ${RELEASE_BRANCH}."
              exit 0
            fi

            if [ "$HAS_BACKPORT_TOKEN" != "true" ] &&
              ! git diff --quiet "$RELEASE_TIP" HEAD -- .github/workflows/; then
              echo "::error::This backport updates a workflow. Configure RELEASE_BACKPORT_TOKEN with Workflows write permission or cherry-pick #${PR_NUMBER} manually."
              exit 1
            fi

            gh auth setup-git --hostname github.com
            if ! git show-ref --verify --quiet "refs/remotes/origin/$CHERRY_PICK_BRANCH"; then
              git push origin "HEAD:refs/heads/$CHERRY_PICK_BRANCH"
            fi

            # Create a PR only if one doesn't already exist for this branch
            EXISTING_PR=$(gh pr list --head "$CHERRY_PICK_BRANCH" --base "$RELEASE_BRANCH" --json number --jq '.[0].number // empty')
            if [ -n "$EXISTING_PR" ]; then
              echo "Cherry-pick pushed to existing PR #${EXISTING_PR}"
            else
              PR_URL=$(gh pr create \
                --title "Backport #${PR_NUMBER} to ${RELEASE_BRANCH}" \
                --body "Automated backport of #${PR_NUMBER}." \
                --base "$RELEASE_BRANCH" \
                --head "$CHERRY_PICK_BRANCH")
              echo "Created cherry-pick PR: $PR_URL"
            fi
          else
            # Cherry-pick failed — abort and notify on the original PR
            git cherry-pick --abort

            BODY=":warning: **Cherry-pick to \`${RELEASE_BRANCH}\` failed due to conflicts.**"
            BODY="${BODY}"$'\n\n'"To resolve manually:"
            BODY="${BODY}"$'\n'"\`\`\`bash"
            BODY="${BODY}"$'\n'"git fetch origin"
            BODY="${BODY}"$'\n'"git checkout ${CHERRY_PICK_BRANCH} 2>/dev/null || git checkout -b ${CHERRY_PICK_BRANCH} origin/${RELEASE_BRANCH}"
            BODY="${BODY}"$'\n'"git cherry-pick ${CHERRY_PICK_ARGS} ${MERGE_SHA}"
            BODY="${BODY}"$'\n'"# resolve conflicts, then:"
            BODY="${BODY}"$'\n'"git push origin ${CHERRY_PICK_BRANCH}"
            BODY="${BODY}"$'\n'"\`\`\`"
            BODY="${BODY}"$'\n'"Then open a PR from \`${CHERRY_PICK_BRANCH}\` into \`${RELEASE_BRANCH}\`."

            gh pr comment "$PR_NUMBER" --body "$BODY"

            echo "status=conflict" >> "$GITHUB_OUTPUT"
            echo "release_branch=${RELEASE_BRANCH}" >> "$GITHUB_OUTPUT"
            echo "::warning::Cherry-pick of #${PR_NUMBER} to ${RELEASE_BRANCH} failed due to conflicts. Commented on the original PR."
          fi

