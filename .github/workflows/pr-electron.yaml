name: PR Electron Checks

on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - "patches/**"
      - "packages/electron-desktop/**"
      - "packages/electron-utils/**"
      - ".github/workflows/pr-electron.yaml"
  workflow_dispatch:
concurrency:
  group: pr-electron-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 200
          fetch-tags: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@mycadet/electron-desktop

      - name: Lint electron-desktop
        working-directory: packages/electron-desktop
        run: bun run lint

      - name: Lint electron-utils
        working-directory: packages/electron-utils
        run: bun run lint
