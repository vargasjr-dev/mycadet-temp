<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- viewport-fit=cover is required for iOS WKWebView to expose
       env(safe-area-inset-*); maximum-scale/user-scalable pin the mobile
       viewport. Same viewport the placeholder capacitor-shell page shipped.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <title>Cadet</title>

    <!--
    Theme stamp — same contract as the standalone index.html: the splash's
    very first paint is already the stored (or system) theme. React re-applies
    the default once the bundle is running. Inline on purpose: an external
    script would be a fetch that blocks the splash.
  -->
    <script>
      (function () {
        try {
          var theme =
            window.localStorage.getItem("device:theme") ||
            window.localStorage.getItem("cadet_theme") ||
            "system";
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var shouldBeDark =
            theme === "velvet" ||
            theme === "dark" ||
            (theme === "system" && prefersDark);
          var root = document.documentElement;
          root.setAttribute("data-theme", shouldBeDark ? "dark" : "light");
          root.classList.toggle("dark", shouldBeDark);
          root.classList.remove("velvet");
        } catch {
          // Theme startup is best-effort. React will apply the default later.
        }
      })();
    </script>

    <!--
    Boot splash styles — the resolved values of `--surface-base` and
    `--content-tertiary` from `packages/design-library/src/tokens.css`,
    light block and dark block. Two dark selectors because there are two
    ways to be dark before React runs: the stamped `data-theme` above, and
    the OS media query when nothing is stamped yet.
  -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f5f4;
        color: #71808e;
      }

      #boot-splash svg {
        animation: boot-splash-spin 1s linear infinite;
      }

      @keyframes boot-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash svg {
          animation: none;
        }
      }

      :root[data-theme="dark"] #boot-splash {
        background: #17191c;
        color: #8d99a5;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) #boot-splash {
          background: #17191c;
          color: #8d99a5;
        }
      }
    </style>
  </head>
  <body>
    <!--
    The splash lives inside #root on purpose: createRoot(...).render() clears
    the container on mount, so React replacing it is the handoff — the same
    contract the standalone index.html uses. The boot module then either
    navigates (the splash stays painted until the entry origin answers) or
    renders the offline state.
  -->
    <div id="root">
      <div id="boot-splash" role="status" aria-label="Loading">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/capacitor/boot.tsx"></script>
  </body>
</html>
