<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- viewport-fit=cover is required for iOS WKWebView to expose
       env(safe-area-inset-*); maximum-scale/user-scalable pin the mobile
       viewport. Same viewport the placeholder capacitor-shell page shipped.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <title>Cadet</title>

    <!--
    Theme stamp — same contract as the standalone index.html. The splash
    itself is always black (the launch screen's ground), so this exists for
    React's first paint: the bundle's UI mounts already themed, no flash.
    Inline on purpose: an external script would be a fetch that blocks the
    splash.
  -->
    <script>
      (function () {
        try {
          var theme =
            window.localStorage.getItem("device:theme") ||
            window.localStorage.getItem("cadet_theme") ||
            "system";
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var shouldBeDark =
            theme === "velvet" ||
            theme === "dark" ||
            (theme === "system" && prefersDark);
          var root = document.documentElement;
          root.setAttribute("data-theme", shouldBeDark ? "dark" : "light");
          root.classList.toggle("dark", shouldBeDark);
          root.classList.remove("velvet");
        } catch {
          // Theme startup is best-effort. React will apply the default later.
        }
      })();
    </script>

    <!--
    Boot splash — the native launch screen held alive. The launch screens
    (#412) are the white Cadet wordmark on black, so the splash the WebView
    paints is the same frame at the same size: no flash at the handoff from
    the native screen, and the small spinner is the only thing that changes.
    No token reads — the app stylesheet is part of the module graph this
    exists to cover.
  -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        color: rgba(255, 255, 255, 0.4);
      }

      .boot-splash-mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
      }

      #boot-splash .boot-splash-spinner {
        animation: boot-splash-spin 1s linear infinite;
      }

      @keyframes boot-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-splash-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!--
    The splash lives inside #root on purpose: createRoot(...).render() clears
    the container on mount, so React replacing it is the handoff — the same
    contract the standalone index.html uses. The app bundle mounts through
    the same main.tsx entry every other host serves.
  -->

          </svg>
          <svg

            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"

            <path d="M21 12a9 9 0 1 1-6.219-8.56" />
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
